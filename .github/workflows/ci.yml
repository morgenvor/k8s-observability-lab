# Офлайн-ворота проекта в GitHub Actions; локальный эквивалент —
# ./scripts/check.sh --smoke (шаги без docker: ./scripts/check.sh).
# Smoke фикстуры (флаг --smoke ниже) — тот же scripts/smoke-local.sh, что и локально.
# Отдельного джоба «docker build» нет: `--smoke` в этом же джобе собирает каждый
# app/*/Dockerfile и запускает контейнеры, то есть покрывает сборку и проверяет
# сверх неё; вторая сборка тех же Dockerfile ничего бы не добавила.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Один прогон на ветку/PR: новый push отменяет предыдущий, иначе два `helmfile template`
# и два `npm ci` конкурируют за раннер. timeout-minutes страхует от залипшего скачивания
# чартов: без него прогон висит до общего лимита GitHub.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Пины по commit SHA (правило: тег — движущаяся цель). v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Install lint tooling
        # pyyaml нужен шагу выгрузки PrometheusRule и ассертам scripts/checks (need_pyyaml).
        # Версии пинованы: обновление линтера не должно менять вердикт ворот само по себе.
        # shellcheck и go не пинуются отдельно: они берутся из образа раннера, поэтому
        # смена образа ubuntu-latest может изменить вердикт ворот без правки репозитория.
        # Это осознанно: пин обоих (shellcheck — бинарником, go — toolchain-шагом)
        # добавляет к каждому прогону загрузку, которая ничего не проверяет.
        run: python3 -m pip install --quiet yamllint==1.38.0 pyyaml==6.0.2
      - name: Install pinned tools
        run: ./scripts/bootstrap-tools.sh
      - name: Offline checks
        # Строгий режим: пропущенная проверка в CI не должна выглядеть как успех
        # (локально допустимы пропуски вроде отсутствующего shellcheck).
        # --smoke запускает фикстуру в docker: «собралось» больше не равно «работает».
        env:
          CHECK_STRICT: "1"
        run: ./scripts/check.sh --smoke
