# Офлайн-ворота проекта. Реальный прогон возможен только после push владельцем
# (правило 3 AGENTS: публикация — действие владельца); локальный эквивалент —
# ./scripts/check.sh и ./scripts/check.sh --images.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lint tooling
        # pyyaml нужен шагу выгрузки PrometheusRule -> rulefiles в scripts/check.sh
        run: python3 -m pip install --quiet yamllint pyyaml
      - name: Install pinned tools
        run: ./scripts/bootstrap-tools.sh
      - name: Offline checks
        run: ./scripts/check.sh

  images:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app images (registry не используется, push не нужен)
        # Тот же скрипт, что локально: иначе CI и локальная сборка расходятся.
        run: IMAGE_TAG=ci ./scripts/build-image.sh
