# Офлайн-ворота проекта. Реальный прогон возможен только после push владельцем
# (правило 3 AGENTS: публикация — действие владельца); локальный эквивалент —
# ./scripts/check.sh --smoke (шаги без docker: ./scripts/check.sh).
# Smoke фикстуры (флаг --smoke ниже) — тот же scripts/smoke-local.sh, что и локально.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lint tooling
        # pyyaml нужен шагу выгрузки PrometheusRule и ассертам scripts/checks (need_pyyaml)
        run: python3 -m pip install --quiet yamllint pyyaml
      - name: Install pinned tools
        run: ./scripts/bootstrap-tools.sh
      - name: Offline checks
        # Строгий режим: пропущенная проверка в CI не должна выглядеть как успех
        # (локально допустимы пропуски вроде отсутствующего shellcheck).
        # --smoke запускает фикстуру в docker: «собралось» больше не равно «работает».
        env:
          CHECK_STRICT: "1"
        run: ./scripts/check.sh --smoke

  images:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app images (registry не используется, push не нужен)
        # Тот же скрипт, что локально: иначе CI и локальная сборка расходятся.
        run: IMAGE_TAG=ci ./scripts/build-image.sh
