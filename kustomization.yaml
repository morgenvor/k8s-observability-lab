apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Свои манифесты проекта одним `kubectl apply -k .`:
# deploy/base — namespace demo, приложения, toxiproxy, ServiceMonitor;
# deploy/dashboards — ConfigMap дашбордов в monitoring;
# deploy/loki-rules — ConfigMap правил Loki ruler;
# deploy/monitoring — AlertmanagerConfig в monitoring;
# rules — PrometheusRule.
resources:
  - deploy/base
  - deploy/dashboards
  - deploy/loki-rules
  - deploy/monitoring
  - rules

# Теги своих образов проставляет scripts/deploy.sh (оверлей в .tmp с тегом = git SHA);
# в git хранится заглушка local, чтобы файл не менялся при каждом деплое.
# Сторонние образы (toxiproxy) здесь не перечисляются: их пины живут в манифестах.
images:
  - name: demo-api
    newTag: local
  - name: demo-load
    newTag: local
  - name: alert-sink
    newTag: local
