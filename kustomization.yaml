apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Свои манифесты проекта одним `kubectl apply -k .` (фазы v1.0):
# deploy/base — namespace demo, приложения, toxiproxy, ServiceMonitor (фаза 2);
# deploy/dashboards — ConfigMap дашбордов в monitoring (фаза 2);
# rules — PrometheusRule (фаза 3).
resources:
  - deploy/base
  - deploy/dashboards
  - rules

# Теги своих образов проставляет scripts/deploy.sh (оверлей в .tmp с тегом = git SHA);
# в git хранится заглушка local, чтобы файл не менялся при каждом деплое.
# Сторонние образы (toxiproxy) здесь не перечисляются: их пины живут в манифестах.
images:
  - name: demo-api
    newTag: local
  - name: demo-load
    newTag: local
  - name: alert-sink
    newTag: local
