# Сторонние чарты проекта в одной точке. Свои манифесты (deploy/, rules/) — kustomize,
# см. kustomization.yaml. Версии чартов пинятся здесь; смена версии — отдельный шаг
# с записью в CHANGELOG.md, а не «заодно обновим».
repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  # Стек мониторинга лабы: уже развёрнут (rev5), values принадлежат проекту.
  # Локальная проверка без кластера: helmfile template -l name=monitoring
  - name: monitoring
    namespace: monitoring
    createNamespace: false
    chart: prometheus-community/kube-prometheus-stack
    version: 92.14.1
    values:
      - helm/values/kps.yaml

  # Логи (фаза 5): Loki SingleBinary на своём PVC 5Gi и Alloy DaemonSet, который читает
  # логи подов через Kubernetes API. Версии — последние на 2026-11-04 из `helm search
  # repo grafana/... --versions`: 7.5.0 (Loki 3.6.16) и 1.15.0 (Alloy v1.21.3).
  # Namespace общий с monitoring: Alloy нужен доступ к API (RBAC из чарта), а Loki
  # адресуется как loki.monitoring.svc:3100 — и из Grafana, и из loki.write.
  - name: loki
    namespace: monitoring
    createNamespace: false
    chart: grafana/loki
    version: 7.5.0
    values:
      - helm/values/loki.yaml
  - name: alloy
    namespace: monitoring
    createNamespace: false
    chart: grafana/alloy
    version: 1.15.0
    values:
      - helm/values/alloy.yaml
