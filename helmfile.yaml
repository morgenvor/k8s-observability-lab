# Сторонние чарты проекта в одной точке. Свои манифесты (deploy/, rules/) — kustomize,
# см. kustomization.yaml. Версии чартов пинятся здесь; смена версии — отдельный шаг
# а не «заодно обновим».
repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  # Стек мониторинга лабы: уже развёрнут (rev5), values принадлежат проекту.
  # Локальная проверка без кластера: helmfile template -l name=monitoring
  - name: monitoring
    namespace: monitoring
    createNamespace: false
    chart: prometheus-community/kube-prometheus-stack
    version: 92.14.1
    values:
      - helm/values/kps.yaml

  # Логи: Loki SingleBinary на своём PVC 5Gi и Alloy DaemonSet, который читает
  # логи подов через Kubernetes API. Версии — последние на 2026-11-04 из `helm search
  # repo grafana/... --versions`: 7.5.0 (Loki 3.6.16) и 1.15.0 (Alloy v1.21.3).
  # Namespace общий с monitoring: Alloy нужен доступ к API (RBAC из чарта), а Loki
  # адресуется как loki.monitoring.svc:3100 — и из Grafana, и из loki.write.
  - name: loki
    namespace: monitoring
    createNamespace: false
    chart: grafana/loki
    version: 7.5.0
    values:
      - helm/values/loki.yaml
    # 2026-11-07: шаблон ServiceMonitor этого чарта гейтится на
    # `.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor"`.
    # В офлайн-рендере (`helmfile template` без кластера) CRD не видна, и объект
    # молча выпадал из рендера: значения включены, а проверить их воротами нечем.
    # Поле объявляет тип только для этого релиза; на живой кластер не влияет —
    # там CRD установлена. В helmfile 1.8.2 оно есть на релизе, а не в
    # helmDefaults (там ключ удалён).
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor
  - name: alloy
    namespace: monitoring
    createNamespace: false
    chart: grafana/alloy
    version: 1.15.0
    values:
      - helm/values/alloy.yaml
