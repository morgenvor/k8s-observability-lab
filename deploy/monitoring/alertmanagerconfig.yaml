# v1alpha1 — единственная версия CRD alertmanagerconfigs у operator v0.94.2
# (v1 в этой сборке CRD нет: kubectl apply -k . на apiVersion v1 даёт
# «no matches for kind AlertmanagerConfig»).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: demo-notifications
  labels:
    app.kubernetes.io/name: demo-notifications
    app.kubernetes.io/part-of: k8s-observability-lab
# Маршрут уведомлений демо-контура. Получателей два, и они не взаимоисключающие:
#   * alert-sink (webhook в namespace demo) — журнал доставленного: /timeline и метрики
#     alertsink_* служат доказательством в дриллах и страховкой от тихой потери алерта;
#   * email (SMTP) — человек: туда уходит severity page|critical, а также алерты самого
#     пути уведомлений (AlertSink*), у которых severity ticket, — им нужен канал вне sink.
# Адреса и SMTP-хост в git — плейсхолдеры example.invalid: реальные значения подставляет
# оверлей при деплое (scripts/lib.sh: render_demo_manifests, env ALERT_EMAIL_TO/
# ALERT_EMAIL_FROM/SMTP_SMARTHOST/SMTP_USERNAME). Пароль приложения SMTP живёт только в
# Secret alertmanager-smtp; в манифесте и репозитории его нет.
#
# Поля CRD camelCase (groupBy/groupWait/...), а не snake_case из плана: так описана
# схема AlertmanagerConfig, и оператор читает именно её.
spec:
  route:
    # receiver родителя практически не используется: Alertmanager добавляет его к
    # доставке, только если не совпал НИ ОДИН child. Здесь child 4 — catch-all без
    # матчеров, он совпадает всегда, поэтому поле обязательно по схеме, но фактически
    # не срабатывает. Убрать catch-all нельзя (см. ниже) — значит, и полагаться на
    # родителя не нужно.
    receiver: alert-sink
    # service есть у SLO-алертов, у инфраструктурных его нет: группировка по
    # отсутствующей метке даёт пустое значение, это штатное поведение Alertmanager.
    groupBy: [alertname, service]
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 4h
    routes:
      # Ветка heartbeat пути уведомлений — ПЕРВОЙ, раньше severity-веток. Алерты
      # AlertSink* (rules/notifications.yaml) сообщают, что маршрут до sink сломан;
      # у них severity ticket, то есть без этой ветки почты не было бы вовсе, и сигнал
      # о поломке пути умирал бы вместе с путём. continue: true — тем же алертом
      # пользуется и /timeline, когда sink жив.
      - receiver: email
        matchers:
          - name: alertname
            value: "AlertSink.*"
            matchType: "=~"
        continue: true
      # page|critical — то, из-за чего будят человека: письмо. continue: true
      # обязателен: без него Alertmanager останавливается на первой совпавшей ветке,
      # и остальные (включая catch-all) для этого алерта не рассматриваются.
      - receiver: email
        matchers:
          - name: severity
            value: "page|critical"
            matchType: "=~"
        continue: true
      # ticket|info|warning|none — рабочее время: остаётся в /timeline.
      - receiver: alert-sink
        matchers:
          - name: severity
            value: "ticket|info|warning|none"
            matchType: "=~"
      # Явный catch-all без матчеров: любой новый или неожиданный severity (и алерт
      # вообще без этой метки) всё равно попадает в приёмник. Без этой ветки
      # несовпавший алерт ушёл бы в null-получатель и исчез молча.
      - receiver: alert-sink
  receivers:
    # Индекс 0 и имя alert-sink не меняются: на них рассчитывает второй аргумент
    # в оверлее адресов (scripts/lib.sh патчит /spec/receivers/1/...) и scripts/check.sh.
    - name: alert-sink
      webhookConfigs:
        - url: http://alert-sink.demo.svc.cluster.local:8080/webhook
          # resolved тоже отправляем: без него в /timeline не видно закрытия алерта,
          # а дрилл фазы 6 проверяет именно пару firing → resolved.
          sendResolved: true
          # 50 алертов на уведомление: sink принимает тело до 1 MiB и отвечает 413
          # на большее, а Alertmanager считает такую доставку неуспешной и ретраит её
          # бесконечно — группа не попала бы в /timeline никогда. Ограничение здесь
          # оставляет шанс, что усечённая группа дойдёт (флаг truncated_alerts).
          maxAlerts: 50
    # Индекс 1 — email: именно сюда бьёт JSON6902-патч адресов. Порядок receivers
    # проверяется офлайн (scripts/check.sh), иначе патч ушёл бы в чужой получатель.
    - name: email
      emailConfigs:
        # Плейсхолдеры: заполнены всегда, чтобы конфиг был валиден для Alertmanager
        # (обязательность to/from/smarthost в CRD не выражена, но Alertmanager без них
        # письмо не отправит). Реальные значения — из env при деплое.
        - to: "alerts@example.invalid"
          from: "alertmanager@example.invalid"
          smarthost: "smtp.example.invalid:587"
          authUsername: "alertmanager"
          # SecretKeySelector: в манифесте пароля нет. Важно: оператор НЕ монтирует
          # Secret файлом, а подставляет значение в сгенерированный конфиг
          # (secret ...-generated, поле auth_password) — при просмотре он открыт,
          # поэтому вывод конфига в логи/тикеты маскируют (docs/runbook.md).
          # Secret создаётся ДО применения конфига (docs/runbook.md, «E-mail (SMTP)»):
          # без него оператор не соберёт новый конфиг, и правка маршрута молча не
          # применится (старый конфиг продолжит работать) — это ловит гейт deploy.sh.
          authPassword:
            name: alertmanager-smtp
            key: smtp-password
          # requireTLS: true — чтобы логин и пароль не ушли открытым текстом.
          # Клиент Alertmanager умеет и plaintext-SMTP (порт не 465 и require_tls
          # false), и тогда AUTH LOGIN/PLAIN передаются без шифрования; для внешнего
          # провайдера это недопустимо. На 465 шифрование начинается сразу (implicit
          # TLS), на 587 — апгрейдом через STARTTLS.
          requireTLS: true
          sendResolved: true
          # Письмо — multipart/alternative: свой text и свой html. До 2026-11-10 html не
          # задавали, и клиент показывал дефолтный шаблон Alertmanager (все labels и
          # annotations таблицей, ссылки не гиперссылками); теперь состав письма наш.
          #
          # Почему ссылки на логи собраны из `time`/`time.window`, а не из «startsAt минус
          # for»: startsAt — это момент, когда истёк for (Prometheus отправляет FiredAt),
          # но арифметики в шаблонах Alertmanager 0.34.1 нет — `toDuration` не определена,
          # проверено прогоном на этом пине. `time` + `time.window` даёт окно
          # `time ± window/2` без единой операции: ±15 минут вокруг срабатывания.
          # Вторая ссылка (`from=startsAt&to=now`) отвечает на «что происходит сейчас».
          #
          # Почему MSK, а не UTC: `tz "Europe/Moscow"` проверен на живом образе —
          # /usr/share/zoneinfo/Europe/Moscow в контейнере есть. Если однажды tzdata из
          # образа уберут, ошибка шаблона сорвёт отправку целиком, а не только время.
          # Хост Grafana — плейсхолдер `grafana.lab.internal` (как в dashboard_url правил);
          # scripts/lib.sh заменяет его на GRAFANA_BASE_URL при рендере.
          text: |
            {{ range .Alerts }}{{ .Status | toUpper }} [{{ .Labels.severity }}] {{ .Labels.alertname }}
            {{ with .Labels.service }}Сервис: {{ . }}
            {{ end }}{{ .Annotations.summary }}
            {{ with .Annotations.description }}{{ . }}
            {{ end }}{{ if .Annotations.runbook_url }}Ранбук: {{ .Annotations.runbook_url }}
            {{ end }}{{ if .Annotations.dashboard_url }}Дашборд: {{ .Annotations.dashboard_url }}
            {{ end }}{{ if .Annotations.logs_url }}Логи, окно инцидента (±15 мин):
            {{ .Annotations.logs_url }}&time={{ .StartsAt.UnixMilli }}&time.window=1800000
            Логи, что сейчас:
            {{ .Annotations.logs_url }}&from={{ .StartsAt.UnixMilli }}&to=now
            {{ end }}{{ if eq .Status "firing" }}Сработал{{ else }}Закрыт{{ end }}:
            {{ .StartsAt | tz "Europe/Moscow" | date "02.01.2006 15:04:05 MST" }}
            ({{ .StartsAt.UTC | date "2006-01-02 15:04:05" }} UTC)
            {{ end }}Стенд: {{ .ExternalURL }}
          html: |
            <div style="font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 14px;">
            {{ range .Alerts }}
            <p style="margin: 0 0 8px;">
            <strong>{{ .Status | toUpper }} [{{ .Labels.severity }}] {{ .Labels.alertname }}</strong>
            {{ with .Labels.service }}Сервис: {{ . }}<br>
            {{ end }}{{ .Annotations.summary }}
            </p>
            {{ with .Annotations.description }}<p style="margin: 0 0 8px;">{{ . }}</p>
            {{ end }}
            <p style="margin: 0 0 8px;">
            {{ if .Annotations.runbook_url }}<a
            href="{{ .Annotations.runbook_url }}">Ранбук: пошаговая диагностика</a><br>
            {{ end }}{{ if .Annotations.dashboard_url }}<a
            href="{{ .Annotations.dashboard_url }}">Дашборд</a><br>
            {{ end }}{{ if .Annotations.logs_url }}<a
            href="{{ .Annotations.logs_url }}&amp;time={{ .StartsAt.UnixMilli }}&amp;time.window=1800000"
            >Логи: окно инцидента (±15 мин)</a><br>
            <a href="{{ .Annotations.logs_url }}&amp;from={{ .StartsAt.UnixMilli }}&amp;to=now"
            >Логи: что сейчас</a><br>
            {{ end }}{{ with .GeneratorURL }}<a href="{{ . }}">Source (Prometheus)</a><br>
            {{ end }}
            <a href="{{ $.ExternalURL }}">Alertmanager</a>
            </p>
            <p style="margin: 0 0 8px; color: #555;">
            {{ if eq .Status "firing" }}Сработал{{ else }}Закрыт{{ end }}:
            {{ .StartsAt | tz "Europe/Moscow" | date "02.01.2006 15:04:05 MST" }}
            ({{ .StartsAt.UTC | date "2006-01-02 15:04:05" }} UTC)
            </p>
            {{ end }}
            <p style="margin: 0; color: #888; font-size: 12px;">Стенд: {{ .ExternalURL }}</p>
            </div>
