apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Объекты проекта, которые обязаны жить в monitoring (фаза 4): их ищет оператор
# kube-prometheus-stack. Отдельный каталог, а не deploy/base, потому что в base
# стоит `namespace: demo`, и трансформер namespace переписал бы AlertmanagerConfig
# в demo — маршрут оказался бы в namespace фикстуры, хотя решение плана этого не
# предполагает. Держим это здесь, а не в rules/: правила проверяет promtool.
resources:
  - alertmanagerconfig.yaml

namespace: monitoring
