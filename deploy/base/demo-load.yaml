# demo-load: генератор нагрузки. Ходит не напрямую в demo-api, а через toxiproxy:
# именно клиентские метрики нагрузки считаются SLI (латентность «как у пользователя»).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-load
  labels:
    app: demo-load
    app.kubernetes.io/name: demo-load
    app.kubernetes.io/part-of: k8s-observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-load
  template:
    metadata:
      labels:
        app: demo-load
        app.kubernetes.io/name: demo-load
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-load
          image: demo-load:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: TARGET_URL
              value: http://toxiproxy.demo:12001/work
          readinessProbe:
            # /ready, а не /healthz: под готов, только когда цикл нагрузки реально
            # тикал недавно (иначе «живой, но не грузит» неотличим от нормы).
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Лимит CPU у генератора — не «на всякий случай», а требование к прибору:
          # SLI считаются по его клиентским метрикам, поэтому его собственный троттлинг
          # попадает прямо в бюджет ошибок. Замер 2026-11-09: при limits.cpu=100m
          # контейнер был заморожен в 26–37 % периодов CFS (10 мс на 100 мс), клиентские
          # длительности квантовались по ~100 мс (498/703/897/1001/1600 мс), 9 % запросов
          # выходили за 300 мс, 2 % — за клиентский timeout 1 с, то есть доступность
          # падала до 0.98 при SLO 0.99 без единой ошибки demo-api. 500m снимает
          # троттлинг с запасом: фактическое потребление 0.04–0.06 ядра (замеры до и
          # после поднятия лимита). Памяти 192Mi —
          # с запасом над реальным RSS 90 МиБ и heap V8 ~113 МиБ (было 64Mi).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-load
  labels:
    app: demo-load
    app.kubernetes.io/name: demo-load
spec:
  selector:
    app: demo-load
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
