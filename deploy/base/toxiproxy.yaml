# toxiproxy: точка инъекции сбоев «снаружи приложения» — сеть, а не код.
# demo-load ходит в 12001, toxiproxy проксирует в demo-api:8080; дриллы latency/errors
# навешивают токсины через API 8474 и снимают их. Сам toxiproxy остаётся без изменений.
# Конфиг — отдельный файл toxiproxy.json и configMapGenerator: хеш в имени ConfigMap
# меняет pod template, поэтому `kubectl apply` сам перезапускает поды (ручной
# `rollout restart` больше не нужен).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  labels:
    app: toxiproxy
    app.kubernetes.io/name: toxiproxy
    app.kubernetes.io/part-of: k8s-observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
        app.kubernetes.io/name: toxiproxy
    spec:
      # runAsNonRoot здесь не ставим: в образе нет USER, kubelet не сможет проверить
      # пользователя и под не стартует. Остальное ужесточение безопасно для root внутри
      # контейнера: бинарник не пишет на диск и слушает порты >1024.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toxiproxy
          # Сторонний образ с пином тега: версия поднимается отдельным решением.
          image: ghcr.io/shopify/toxiproxy:2.9.0
          imagePullPolicy: IfNotPresent
          args:
            - -host
            - 0.0.0.0
            - -config
            - /config/toxiproxy.json
          ports:
            - name: api
              containerPort: 8474
              protocol: TCP
            - name: proxy
              containerPort: 12001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /proxies
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /proxies
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: toxiproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  labels:
    app: toxiproxy
    app.kubernetes.io/name: toxiproxy
spec:
  selector:
    app: toxiproxy
  ports:
    - name: api
      port: 8474
      targetPort: api
      protocol: TCP
    - name: proxy
      port: 12001
      targetPort: proxy
      protocol: TCP
