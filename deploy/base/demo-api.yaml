# demo-api: 2 реплики на разных нодах (мягкий anti-affinity), пробы на /healthz и /ready.
# Образ собирается локально и импортируется в k3s (registry в лабе нет), тег = короткий git SHA
# подставляет scripts/deploy.sh, поэтому в git стоит заглушка local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app: demo-api
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: k8s-observability-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
        app.kubernetes.io/name: demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Мягкий антиаффинити: при 2 нодах реплики обычно расходятся, но при вытеснении
      # ноды под не останется Pending — для демо важнее работоспособность, чем строгость.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: demo-api
      containers:
        - name: demo-api
          image: demo-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  labels:
    app: demo-api
    app.kubernetes.io/name: demo-api
spec:
  selector:
    app: demo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
