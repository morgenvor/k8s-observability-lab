# ServiceMonitor'ы живут в demo вместе с сервисами, но оператор ищет их по метке
# release=monitoring (serviceMonitorSelector в kube-prometheus-stack).
# Без этой метки цели просто не появятся в Prometheus — это самая частая «невидимая» ошибка.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  labels:
    release: monitoring
    app.kubernetes.io/name: demo-api
spec:
  selector:
    matchLabels:
      app: demo-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-load
  labels:
    release: monitoring
    app.kubernetes.io/name: demo-load
spec:
  selector:
    matchLabels:
      app: demo-load
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# 2026-11-04: sink тоже цель Prometheus, иначе метрики доставки
# alertsink_* живут только в самом сервисе, а пропажу sink не видит ни TargetDown,
# ни дашборд. job у цели = alert-sink (из имени ServiceMonitor), а не demo-*.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alert-sink
  labels:
    release: monitoring
    app.kubernetes.io/name: alert-sink
spec:
  selector:
    matchLabels:
      app: alert-sink
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
