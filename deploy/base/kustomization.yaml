apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Всё содержимое base живёт в namespace demo; теги образов подставляет scripts/deploy.sh.
resources:
  - namespace.yaml
  - demo-api.yaml
  - demo-load.yaml
  - alert-sink.yaml
  - toxiproxy.yaml
  - servicemonitors.yaml

# Хеш в имени ConfigMap — намеренно: при правке toxiproxy.json меняется pod template
# и rollout происходит сам, без ручного `kubectl rollout restart`.
configMapGenerator:
  - name: toxiproxy-config
    files:
      - toxiproxy.json

namespace: demo
