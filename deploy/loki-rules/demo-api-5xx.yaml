# Правило Loki ruler — второй класс проверки рядом с метриками Prometheus.
# Это файл правил самого Loki (группа/правило/аннотации), а не PrometheusRule CRD:
# его читает ruler внутри пода Loki из локального хранилища правил. Селектор в expr —
# LogQL, поэтому promtool такие правила проверять не умеет; структуру проверяет
# scripts/check.sh, поведение — живой прогон (plan v1.1, Phase 5).
#
# Зачем отдельное правило, если есть метрический путь. Метрика `demo_api` считает
# ответы сервера, но не различает, что именно произошло с запросом: 5xx здесь виден
# ровно как доля в SLO. Логи несут то, чего в метрике нет: конкретный status, route,
# request_id, а также события без HTTP-ответа (`request_aborted` — клиент оборвал
# соединение, в метрике это 499). Обратное тоже верно: сетевой обрыв до приложения
# (toxiproxy закрывает соединение) в логах demo-api не появляется вовсе, его видит
# только клиентская метрика demo-load. Поэтому правило по логам — дополнение
# к SLO-алертам, а не их замена.
groups:
  - name: demo-api-logs
    # Явно, хотя дефолт ruler — 1m: от интервала зависит, как быстро `for: 2m`
    # превращается в доставку (5m окно + 2m + интервал).
    interval: 1m
    rules:
      - alert: DemoApi5xxFromLogs
        # Строки http_request со статусом ≥ 500 за 5 минут, КРОМЕ /ready. Окно короче
        # окна SLO (5m — минимальное окно burn rate): правило отвечает на «прямо сейчас
        # сыпется 5xx», а не дублирует бюджет ошибок.
        #
        # Почему исключён /ready (найдено 2026-11-09 на живых данных): при SIGTERM
        # demo-api сразу отвечает /ready → 503, чтобы под убрали из endpoints. Это
        # штатный дренаж, а не отказ клиенту, но одна такая строка держится в окне
        # 5m, `for: 2m` выполняется — и правило горело бы ticket на каждом деплое,
        # rollout restart и дрилле oomkill. Цена фильтра: 503 самопроверки готовности
        # больше не считается ошибкой; отказ, который действительно видит клиент,
        # приходит по /work и остальным маршрутам.
        expr: sum(count_over_time({namespace="demo", app="demo-api"} | json | status >= 500 | route != "/ready" [5m])) > 0
        for: 2m
        labels:
          # ticket, а не page: отказ уже виден в метриках красным, а это уточнение
          # причины по логам — смотреть надо, но человека ночью не будить.
          severity: ticket
          service: demo-api
          namespace: demo
        annotations:
          summary: "demo-api отвечает 5xx по логам (подробности — в строках http_request)"
          runbook_url: https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#правило-по-логам-loki-ruler
