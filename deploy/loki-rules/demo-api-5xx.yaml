# Правило Loki ruler — второй класс проверки рядом с метриками Prometheus.
# Это файл правил самого Loki (группа/правило/аннотации), а не PrometheusRule CRD:
# его читает ruler внутри пода Loki из локального хранилища правил. Селектор в expr —
# LogQL, поэтому promtool такие правила проверять не умеет; структуру проверяет
# scripts/check.sh, поведение — живой прогон (plan v1.1, Phase 5).
#
# Зачем отдельное правило. SLO проекта считаются по КЛИЕНТСКИМ метрикам demo-load
# (`load_requests_total{job="demo-load"}`, см. rules/demo-slo.yaml): они дают долю
# неуспешных запросов с точки зрения клиента, но не причину. Метрика самого demo-api
# (`http_requests_total{status_class}`) несёт только класс ответа — тоже без деталей.
# Логи дают то, чего нет ни там, ни там: конкретный `status`, `route`, `request_id`,
# плюс события без HTTP-ответа (`request_aborted` — клиент оборвал соединение; в
# метрике это 499). Обратное тоже верно: сетевой обрыв до приложения клиентская
# метрика видит, а лог demo-api 5xx-строку по такому запросу не содержит. Поэтому
# правило по логам — дополнение к SLO-алертам, а не их замена.
groups:
  - name: demo-api-logs
    # Явно, хотя дефолт ruler — 1m: от интервала зависит, как быстро `for: 2m`
    # превращается в доставку (5m окно + 2m + интервал).
    interval: 1m
    rules:
      - alert: DemoApi5xxFromLogs
        # Любая строка demo-api со status >= 500 за 5 минут, кроме /ready. Сюда
        # попадают оба события приложения с этим полем: `http_request` (ответ отдан)
        # и `request_failed` (исключение в обработчике, см. app/demo-api/src/server.js).
        #
        # Окно 5m — минимальное окно burn rate: правило отвечает на «прямо сейчас
        # сыпется 5xx», а не дублирует бюджет ошибок. `for: 2m` НЕ отсекает одиночные
        # строки: одна 5xx-строка держит условие истинным все 5 минут окна, поэтому
        # `for` только откладывает срабатывание. Нужен порог — менять `> 0` на `> N`,
        # а не `for`.
        #
        # Почему исключён /ready (найдено 2026-11-09 на живых данных): при SIGTERM
        # demo-api сразу отвечает /ready → 503, чтобы под убрали из endpoints. Это
        # штатный дренаж, а не отказ клиенту, но одна такая строка держится в окне
        # 5m, `for: 2m` выполняется — и правило горело бы ticket на каждом плановом
        # рестарте с SIGTERM (деплой, rollout restart). Цена фильтра: 503 самопроверки
        # готовности больше не считается ошибкой. SLO от этого не теряет ничего:
        # demo-load обращается только к /work, /ready он не вызывает.
        expr: >-
          sum(count_over_time({namespace="demo", app="demo-api"} | json
          | status >= 500 | route != "/ready" [5m])) > 0
        for: 2m
        labels:
          # ticket, а не page: сам отказ клиент видит в SLO-алертах, а это уточнение
          # причины по логам — смотреть надо, но человека ночью не будить. Маршрут
          # `severity: ticket` ведёт только в alert-sink (`/timeline`), не в почту.
          severity: ticket
          service: demo-api
          namespace: demo
        annotations:
          summary: "demo-api отвечает 5xx по логам (подробности — в строках http_request/request_failed)"
          runbook_url: https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#правило-по-логам-loki-ruler
