apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Правила Loki ruler в monitoring: их читает сам Loki из смонтированного каталога,
# оператор kube-prometheus-stack тут не участвует (это не PrometheusRule).
# Имя ConfigMap без хеша, и это не косметика: имя `loki-rules` зашито в helm values
# (`singleBinary.extraVolumes` в helm/values/loki.yaml), а kustomize не переписывает
# ссылки в чартах. С хешем в имени под Loki монтировал бы несуществующий ConfigMap и
# не встал бы вовсе. Побочный плюс: правка правила обновляет данные того же тома,
# поэтому под не пересоздаётся — ruler перечитывает файл сам.
configMapGenerator:
  - name: loki-rules
    files:
      - demo-api-5xx.yaml
    options:
      labels:
        app.kubernetes.io/part-of: k8s-observability-lab
      disableNameSuffixHash: true

namespace: monitoring
