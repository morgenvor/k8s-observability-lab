apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Дашборд лежит в monitoring: там его читает sidecar Grafana (LABEL=grafana_dashboard).
# Сам JSON — отдельный файл (это JSON, а не YAML): так его проверяет любой JSON-парсер,
# а yamllint не ругается на длинные строки PromQL.
configMapGenerator:
  - name: demo-red
    files:
      - demo-red.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: k8s-observability-lab
      annotations:
        # Папку sidecar учитывает только при folderAnnotation в values Grafana;
        # без этого дашборд попадёт в общую папку (см. CHANGELOG).
        grafana_folder: demo
  # SLO-дашборд (фаза 3): бюджеты, burn rate по окнам, текущий SLI.
  - name: slo-demo
    files:
      - slo-demo.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: k8s-observability-lab
      annotations:
        grafana_folder: demo
  # Журнал уведомлений (v1.1): приходы в alert-sink из Loki плюс метрики доставки.
  # Читает то, что sink и так пишет в stdout и `/metrics`: нового кода и новых
  # компонентов нет, `/timeline` остаётся контрактом для evidence дриллов.
  - name: notifications
    files:
      - notifications.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: k8s-observability-lab
      annotations:
        grafana_folder: demo

# Имя ConfigMap без хеша: так его ждёт sidecar и так проще искать глазами.
generatorOptions:
  disableNameSuffixHash: true

namespace: monitoring
