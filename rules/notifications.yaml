# Heartbeat пути уведомлений.
#
# Зачем это нужно. Все остальные правила проекта сторожат сервис и мониторинг, но не
# сам путь «Prometheus → Alertmanager → sink»: если маршрут перестанет доводить
# уведомления, дашборды останутся зелёными, а алертов не будет по определению.
# Чарт это не закрывает: AlertmanagerFailedToSendAlerts и
# AlertmanagerClusterFailedToSendAlerts горят на ОШИБКАХ отправки, а при потерянном
# receiver или пустом дереве маршрутов ошибок нет — есть тишина. Ошибку ЗАГРУЗКИ конфига
# (невалидный YAML, отсутствующий Secret) ловит другое правило чарта —
# AlertmanagerFailedReload (critical → e-mail), поэтому здесь его не дублируем.
# Поэтому здесь свои правила (дубля с чартом нет: на ошибки доставки своих не пишем).
#
# Опорный сигнал — watchdog от чарта: алерт Watchdog (severity=none) всегда firing и
# уходит в sink каждые repeatInterval = 4h (общий параметр маршрута в
# deploy/monitoring/alertmanagerconfig.yaml). Sink хранит время последнего принятого
# уведомления в alertsink_last_notification_timestamp_seconds. Порог 5,5 ч (19800 с) =
# 4 ч повторного интервала + запас на groupWait/повторную доставку.
# Отсюда зависимость, о которой надо знать при правках: если правило Watchdog выключат
# или уведут в другой маршрут, метрика sink перестанет расти и AlertSinkNeverReceived
# начнёт ложно гореть через 5,5 ч аптайма. При смене repeatInterval порог пересматривается.
#
# Что не является инцидентом: остановленная лаба. Оба heartbeat-правила требуют up == 1,
# а если Prometheus не работает, он и не считает. Падение самого sink (up == 0) ловят
# правила чарта по цели, а не heartbeat: «sink умер» и «до sink ничего не доходит» —
# разные отказы, и путать их в одном правиле значит терять диагноз.
#
# Пропажу цели целиком (серии up{job="alert-sink"} нет вовсе: удалён ServiceMonitor,
# Service или Deployment) не видят ни heartbeat-правила — им нужна серия, — ни TargetDown
# чарта, которому нужен up == 0. Этот случай закрывает третье правило
# AlertSinkTargetMissing.
#
# Куда уходят эти алерты: у всех трёх severity ticket, но имя начинается с AlertSink, и
# в deploy/monitoring/alertmanagerconfig.yaml есть отдельная (первая) ветка
# alertname=~"AlertSink.*" → email с continue: true. Иначе сигнал «маршрут до sink
# сломан» шёл бы только в сломанный sink. При переименовании правил ветку маршрута
# нужно править вместе с ними — это проверяет scripts/check.sh.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-alerting-path
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: demo-alerting-path
    app.kubernetes.io/part-of: k8s-observability-lab
spec:
  groups:
    - name: demo-alerting-path.heartbeat
      rules:
        # Gauge > 0 — защита от ложного срабатывания сразу после рестарта пода:
        # на старте счётчик времени равен 0, и без этой ветки правило считало бы
        # «последнее уведомление было в 1970 году». С 0 разбирается следующее правило.
        # Цена защиты: между рестартом и первым Watchdog (до 4 ч) правило слепо, поэтому
        # sink, который рестартуют чаще, чем раз в 5,5 ч, при сломанном маршруте не
        # репортится вовсе — второго правила это тоже не ловит (ему нужен аптайм 5,5 ч).
        - alert: AlertSinkHeartbeatMissing
          expr: |
            (alertsink_last_notification_timestamp_seconds > 0)
            and
            (time() - alertsink_last_notification_timestamp_seconds > 19800)
            and on()
            (up{job="alert-sink"} == 1)
          for: 10m
          labels:
            severity: ticket
            service: alert-sink
            namespace: demo
          annotations:
            summary: "Путь уведомлений: sink молчит дольше 5,5 ч"
            description: >-
              alert-sink жив, но последнее уведомление он принял больше 5,5 часов назад.
              Watchdog от чарта (всегда firing, repeatInterval 4h) обязан приходить в sink
              чаще, поэтому тишина означает, что уведомления не доезжают. Ошибок отправки
              при этом может не быть вовсе: AlertmanagerFailedToSendAlerts и
              AlertmanagerClusterFailedToSendAlerts видят только неудачную отправку, а не
              потерянный receiver или пустое дерево маршрутов. Проверь /timeline, активный
              конфиг Alertmanager и лог sink.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#путь-уведомлений"

        # Второй случай: gauge так и остался 0, то есть уведомлений не было НИ ОДНОГО
        # (включая Watchdog). Смотрим на uptime процесса, а не на время с рестарта
        # пода: gauge процесса экспортирует сам sink и он же служит признаком «правило
        # молчит, потому что нечего было запоминать».
        - alert: AlertSinkNeverReceived
          expr: |
            (up{job="alert-sink"} == 1)
            and
            (time() - alertsink_process_start_time_seconds > 19800)
            and
            (alertsink_last_notification_timestamp_seconds == 0)
          for: 10m
          labels:
            severity: ticket
            service: alert-sink
            namespace: demo
          annotations:
            summary: "Путь уведомлений: sink жив, но не получил ни одного уведомления"
            description: >-
              alert-sink работает дольше 5,5 часов, но не принял ни одного уведомления —
              даже Watchdog от чарта, который всегда firing и повторяется раз в 4 часа.
              Значит, сломан маршрут или конфиг Alertmanager: уведомления не доходят до
              sink вовсе. Это не ошибка отправки (её видят правила чарта), а её отсутствие:
              ошибок нет, потому что отправлять нечего или некуда. Проверь дерево
              маршрутов в активном конфиге Alertmanager, alertmanager_config_last_reload_successful
              и /timeline.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#путь-уведомлений"

        # Третий случай — цели нет вовсе. Данные о её отсутствии приходят только от
        # запроса, а не от серии, поэтому здесь absent(). sum() вокруг absent(): в
        # Prometheus 3.x absent() возвращает метки равенства из селектора, и без sum()
        # алерт получил бы лишнюю метку job — тот же приём, что в rules/meta.yaml.
        - alert: AlertSinkTargetMissing
          expr: sum(absent(up{job="alert-sink", namespace="demo"})) > 0
          for: 10m
          labels:
            severity: ticket
            service: alert-sink
            namespace: demo
          annotations:
            summary: "Путь уведомлений: цели alert-sink нет в Prometheus"
            description: >-
              Серии up{job="alert-sink"} нет дольше 10 минут: удалён ServiceMonitor или
              Service, либо sink снят в 0 реплик. Оба heartbeat-правила в этом случае молчат
              (им нужна серия), TargetDown чарта — тоже: ему нужен up == 0, а не отсутствие
              цели. Доставка в sink при этом не наблюдается вовсе, и тишина выглядит как
              норма. Проверь ServiceMonitor alert-sink (метка release=monitoring),
              kubectl -n demo get deploy,svc,endpoints и метрики пода.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#путь-уведомлений"
