# Юнит-тесты heartbeat пути уведомлений (promtool test rules).
#
# Загружается ТОЛЬКО notifications.yaml: правила смотрят на метрики alert-sink и на up
# его цели, остальные правила проекта на результат не влияют.
#
# Время в promtool-тестах — не настенное: time() возвращает момент вычисления, а серии
# начинаются с нуля. Поэтому «прошло 6 часов» моделируется eval_time: 24h при
# постоянном значении 64800 = 86400 - 21600. Порог правила — 19800 с (5,5 ч).
#
# Покрытые пары:
#  * свежее уведомление + долгий uptime — тишина (норма);
#  * возраст уведомления чуть меньше порога (19700 с) — тишина: привязывает порог
#    к 19800, иначе подмена 19800 на меньшую константу прошла бы незамеченной;
#  * уведомление старше 5,5 ч при живом sink — AlertSinkHeartbeatMissing;
#  * рестарт пода (gauge = 0, uptime маленький) — оба правила молчат;
#  * долгий uptime и gauge = 0 — AlertSinkNeverReceived;
#  * up == 0 при старом gauge — heartbeat молчит: упавший sink ловят правила чарта;
#  * up == 0 при gauge = 0 — молчат оба: проверяет ветку up == 1 внутри
#    AlertSinkNeverReceived (без неё правило загорелось бы на мёртвой цели);
#  * серии up нет вовсе — AlertSinkTargetMissing (absent); heartbeat-правила при этом
#    молчат, хотя их серии на месте: heartbeat сторожит молчание пути, а не пропажу цели.
rule_files:
  - ../../.tmp/rendered/rulefiles/notifications.yaml
evaluation_interval: 1m

tests:
  # --- норма: Watchdog доезжает ------------------------------------------------
  - name: "уведомление свежее: оба правила молчат"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '86000x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '1x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkTargetMissing
        exp_alerts: []

  # --- тишина маршрута при живом sink -----------------------------------------
  - name: "последнее уведомление старше 5,5 ч: AlertSinkHeartbeatMissing горит"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '1x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: alert-sink
              namespace: demo
              job: alert-sink
            exp_annotations:
              summary: "Путь уведомлений: sink молчит дольше 5,5 ч"
              description: >-
                alert-sink жив, но последнее уведомление он принял больше 5,5 часов назад.
                Watchdog от чарта (всегда firing, repeatInterval 4h) обязан приходить в sink
                чаще, поэтому тишина означает, что уведомления не доезжают. Ошибок отправки
                при этом может не быть вовсе: AlertmanagerFailedToSendAlerts и
                AlertmanagerClusterFailedToSendAlerts видят только неудачную отправку, а не
                потерянный receiver или пустое дерево маршрутов. Проверь /timeline, активный
                конфиг Alertmanager и лог sink.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#путь-уведомлений"
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []

  # --- сразу после рестарта пода: gauge = 0, но это не поломка пути -------------
  - name: "рестарт sink: gauge = 0 при коротком uptime — оба правила молчат"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '0x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '86000x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '1x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []

  # --- sink живёт давно и не получил ни одного уведомления ----------------------
  - name: "uptime > 5,5 ч и gauge = 0: AlertSinkNeverReceived горит"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '0x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '1x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: alert-sink
              namespace: demo
              job: alert-sink
            exp_annotations:
              summary: "Путь уведомлений: sink жив, но не получил ни одного уведомления"
              description: >-
                alert-sink работает дольше 5,5 часов, но не принял ни одного уведомления —
                даже Watchdog от чарта, который всегда firing и повторяется раз в 4 часа.
                Значит, сломан маршрут или конфиг Alertmanager: уведомления не доходят до
                sink вовсе. Это не ошибка отправки (её видят правила чарта), а её отсутствие:
                ошибок нет, потому что отправлять нечего или некуда. Проверь дерево
                маршрутов в активном конфиге Alertmanager, alertmanager_config_last_reload_successful
                и /timeline.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#путь-уведомлений"
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []

  # --- sink упал: это не «тишина пути» ------------------------------------------
  - name: "up == 0 при старом gauge: heartbeat молчит, падение ловят правила чарта"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '0x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []

  # --- возраст чуть меньше порога: привязка 19800 ------------------------------
  # 86400 - 66700 = 19700 с, то есть на 100 с меньше порога. Тест падает, если порог
  # в правиле уменьшат (19800 -> 3600 и подобное): тогда здесь было бы firing.
  - name: "уведомление моложе порога на 100 с: оба правила молчат"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '66700x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '1x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []

  # --- мёртвая цель и пустой gauge -------------------------------------------
  # Проверяет ветку up == 1 внутри AlertSinkNeverReceived: без неё правило
  # загорелось бы на цели, которой уже нет (uptime по метрике > 5,5 ч, gauge = 0).
  - name: "up == 0 и gauge = 0: AlertSinkNeverReceived молчит"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '0x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
      - series: 'up{job="alert-sink", namespace="demo"}'
        values: '0x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []

  # --- цели нет вовсе: серии up{job="alert-sink"} нет ---------------------------
  # Метрики самого sink в тесте оставлены живыми: heartbeat-правила при этом молчат
  # (last_notification свежий, up отсутствует), а срабатывает только absent()-правило.
  - name: "серии up нет: AlertSinkTargetMissing горит, heartbeat молчит"
    interval: 1m
    input_series:
      - series: 'alertsink_last_notification_timestamp_seconds{job="alert-sink", namespace="demo"}'
        values: '86000x1441'
      - series: 'alertsink_process_start_time_seconds{job="alert-sink", namespace="demo"}'
        values: '64800x1441'
    alert_rule_test:
      - eval_time: 24h
        alertname: AlertSinkTargetMissing
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: alert-sink
              namespace: demo
            exp_annotations:
              summary: "Путь уведомлений: цели alert-sink нет в Prometheus"
              description: >-
                Серии up{job="alert-sink"} нет дольше 10 минут: удалён ServiceMonitor или
                Service, либо sink снят в 0 реплик. Оба heartbeat-правила в этом случае молчат
                (им нужна серия), TargetDown чарта — тоже: ему нужен up == 0, а не отсутствие
                цели. Доставка в sink при этом не наблюдается вовсе, и тишина выглядит как
                норма. Проверь ServiceMonitor alert-sink (метка release=monitoring),
                kubectl -n demo get deploy,svc,endpoints и метрики пода.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#путь-уведомлений"
      - eval_time: 24h
        alertname: AlertSinkHeartbeatMissing
        exp_alerts: []
      - eval_time: 24h
        alertname: AlertSinkNeverReceived
        exp_alerts: []
