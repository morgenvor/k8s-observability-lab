# Юнит-тесты правил пайплайна логов (promtool test rules).
#
# Загружается ТОЛЬКО pipeline.yaml: правила про Loki/Alloy не зависят от demo-slo,
# и лишние серии в тесте только запутали бы, что именно проверяется.
#
# Смысл набора — зафиксировать пары «цель есть / цели нет» и границы покрытия:
#  * up == 0 — цель скрейпится, но отвечает ошибкой;
#  * absent() — цели нет вовсе (удалён объект, выключен ServiceMonitor, нет
#    эндпоинтов); `up == 0` в этом случае молчит, это и проверяется;
#  * Alloy сравнивается с числом нод, а не с желаемым числом реплик DaemonSet.
rule_files:
  - ../../.tmp/rendered/rulefiles/pipeline.yaml
evaluation_interval: 1m

tests:
  # --- Loki: цель есть, скрейп не удаётся -----------------------------------
  - name: "Loki отвечает ошибкой: LokiDown горит, LokiTargetMissing молчит"
    interval: 1m
    input_series:
      - series: 'up{job="monitoring/loki", namespace="monitoring"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiDown
        exp_alerts:
          - exp_labels:
              job: monitoring/loki
              namespace: monitoring
              service: loki
              severity: ticket
            exp_annotations:
              summary: "Loki: цель скрейпа не отвечает"
              description: >-
                /metrics Loki не отдаёт метрики дольше 5 минут при живой цели: процесс
                завис или упёрся в память. Grafana в это время не читает логи, а Alloy
                копит ошибки push. Проверь под loki-0, kubectl logs и /ready.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
      - eval_time: 10m
        alertname: LokiTargetMissing
        exp_alerts: []

  # --- Loki: цели нет вовсе ------------------------------------------------
  # Единственная серия в этом тесте — alloy: значит, Loki не скрейпится и никогда
  # не скрейпился. Именно этот случай в лабе давал полную тишину до 2026-11-07.
  - name: "цели Loki нет вовсе: LokiTargetMissing горит, LokiDown молчит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: LokiTargetMissing
        exp_alerts:
          - exp_labels:
              job: monitoring/loki
              namespace: monitoring
              service: loki
              severity: ticket
            exp_annotations:
              summary: "Loki: цели скрейпа нет вовсе"
              description: >-
                Серии up{job="monitoring/loki"} нет 10 минут: удалён StatefulSet или
                Service, выключен ServiceMonitor, либо у Service нет готовых
                эндпоинтов. В отличие от up == 0 это не «сломанный скрейп», а
                «нечего скрейпить» — молчание не означает здоровье.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
      - eval_time: 15m
        alertname: LokiDown
        exp_alerts: []

  # --- Loki: строка не приходит --------------------------------------------
  - name: "Loki не принимает строки: LokiNotIngesting горит"
    interval: 1m
    input_series:
      - series: 'up{job="monitoring/loki", namespace="monitoring"}'
        values: '1x50'
      - series: 'loki_distributor_lines_received_total{namespace="monitoring", tenant="fake"}'
        values: '100x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: LokiNotIngesting
        exp_alerts:
          - exp_labels:
              namespace: monitoring
              service: loki
              severity: info
            exp_annotations:
              summary: "Loki: строки не поступают"
              description: >-
                За 15 минут distributor Loki не принял ни одной строки, и так уже 30
                минут. Проверь Alloy (DaemonSet 2/2, его логи), push-URL
                loki.monitoring.svc:3100 и фильтр __meta_kubernetes_pod_node_name;
                если всё цело — возможно, в demo и monitoring просто тихо.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"

  - name: "Loki принимает строки: LokiNotIngesting молчит"
    interval: 1m
    input_series:
      - series: 'up{job="monitoring/loki", namespace="monitoring"}'
        values: '1x50'
      - series: 'loki_distributor_lines_received_total{namespace="monitoring", tenant="fake"}'
        values: '100+60x50'
    alert_rule_test:
      - eval_time: 45m
        alertname: LokiNotIngesting
        exp_alerts: []

  # --- Alloy: цель есть, скрейп не удаётся ----------------------------------
  # Пара правил устроена так же, как у Loki: up == 0 ловит сломанный скрейп,
  # absent() — отсутствие цели. Тесты фиксируют, что они не срабатывают парой.
  - name: "Alloy отвечает ошибкой: AlloyDown горит, AlloyTargetMissing молчит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlloyDown
        exp_alerts:
          - exp_labels:
              job: alloy
              namespace: monitoring
              service: alloy
              severity: ticket
            exp_annotations:
              summary: "Alloy: реплика не отдаёт метрики"
              description: >-
                Одна из реплик DaemonSet alloy не скрейпится дольше 5 минут: логи
                подов этой ноды не собираются. Проверь под на нужной ноде, его логи и
                статус DaemonSet.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
      - eval_time: 10m
        alertname: AlloyTargetMissing
        exp_alerts: []

  # --- Alloy: цели нет вовсе -----------------------------------------------
  - name: "цели Alloy нет вовсе: AlloyTargetMissing горит, AlloyDown молчит"
    interval: 1m
    input_series:
      - series: 'up{job="monitoring/loki", namespace="monitoring"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AlloyTargetMissing
        exp_alerts:
          - exp_labels:
              job: alloy
              namespace: monitoring
              service: alloy
              severity: ticket
            exp_annotations:
              summary: "Alloy: целей скрейпа нет вовсе"
              description: >-
                Серии up{job="alloy"} нет 10 минут: удалён DaemonSet или Service,
                выключен ServiceMonitor, либо у сервиса нет эндпоинтов. Сбор логов
                при этом стоит полностью, а не частично.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
      - eval_time: 15m
        alertname: AlloyDown
        exp_alerts: []

  # --- Alloy: покрытие нод -------------------------------------------------
  - name: "Alloy на двух нодах из двух: AlloyCoverageIncomplete молчит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x30'
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.2:12345"}'
        values: '1x30'
      - series: 'kube_node_info{instance="n1"}'
        values: '1x30'
      - series: 'kube_node_info{instance="n2"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlloyCoverageIncomplete
        exp_alerts: []

  - name: "Alloy только на одной ноде из двух: AlloyCoverageIncomplete горит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x30'
      - series: 'kube_node_info{instance="n1"}'
        values: '1x30'
      - series: 'kube_node_info{instance="n2"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlloyCoverageIncomplete
        exp_alerts:
          - exp_labels:
              namespace: monitoring
              service: alloy
              severity: ticket
            exp_annotations:
              summary: "Alloy: реплик меньше, чем нод"
              description: >-
                Живых целей alloy меньше, чем нод в кластере: логи части нод не
                собираются. Типичные причины — под не встал (ресурсы, taint),
                реплика не скрейпится или DaemonSet кем-то урезан по nodeSelector.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"

  # --- Alloy: потеря записей -----------------------------------------------
  - name: "Alloy выбрасывает логи: AlloyDroppedLogs горит по reason"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x20'
      - series: 'loki_write_dropped_entries_total{job="alloy", namespace="monitoring", reason="queue_is_full"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AlloyDroppedLogs
        exp_alerts:
          - exp_labels:
              # sum by (reason) выбрасывает job/component_id/namespace, поэтому в
              # алерте остаются reason и статические метки правила (namespace, service).
              reason: queue_is_full
              namespace: monitoring
              service: alloy
              severity: ticket
            exp_annotations:
              summary: "Alloy теряет логи (reason=queue_is_full)"
              description: >-
                Alloy выбрасывает записи дольше 10 минут: очередь переполнена, Loki
                отвечает ошибками или режет лимитами. Логи demo/monitoring теряются
                безвозвратно — это не задержка, а пропуск. Смотри reason и логи Alloy.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"

  - name: "Alloy ничего не теряет: AlloyDroppedLogs молчит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x20'
      - series: 'loki_write_dropped_entries_total{job="alloy", namespace="monitoring", reason="queue_is_full"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: AlloyDroppedLogs
        exp_alerts: []

  # --- Alloy: фильтр старых строк -------------------------------------------
  # Норма: счётчик не растёт (строки моложе порога доезжают до Loki).
  - name: "Alloy не отбрасывает старые строки: AlloyOldLogsDropped молчит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x45'
      - series: 'loki_process_dropped_lines_total{job="alloy", namespace="monitoring", reason="too_old", instance="10.0.0.1:12345"}'
        values: '0x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: AlloyOldLogsDropped
        exp_alerts: []

  # Всплеск после пересоздания пода: counter прыгнул один раз и замер. rate за 15
  # минут затухает, поэтому 30 минут условие не держится и алерт молчит — иначе он
  # горел бы на каждом rollout DaemonSet.
  - name: "всплеск после рестарта Alloy: AlloyOldLogsDropped молчит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x45'
      - series: 'loki_process_dropped_lines_total{job="alloy", namespace="monitoring", reason="too_old", instance="10.0.0.1:12345"}'
        values: '0x5 15000x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: AlloyOldLogsDropped
        exp_alerts: []

  # Устойчивая потеря: счётчик растёт непрерывно — значит старыми стали живые строки.
  - name: "старые строки выбрасываются непрерывно: AlloyOldLogsDropped горит"
    interval: 1m
    input_series:
      - series: 'up{job="alloy", namespace="monitoring", instance="10.0.0.1:12345"}'
        values: '1x45'
      - series: 'loki_process_dropped_lines_total{job="alloy", namespace="monitoring", reason="too_old", instance="10.0.0.1:12345"}'
        values: '0+60x45'
    alert_rule_test:
      - eval_time: 40m
        alertname: AlloyOldLogsDropped
        exp_alerts:
          - exp_labels:
              # sum by (instance) сохраняет instance и выбрасывает остальные метки серии;
              # job/namespace серии заменяются статическими метками правила.
              instance: 10.0.0.1:12345
              namespace: monitoring
              service: alloy
              severity: ticket
            exp_annotations:
              summary: "Alloy выбрасывает старые строки дольше 30 минут"
              description: >-
                Фильтр stage.drop отбрасывает строки старше 50 минут непрерывно:
                после рестарта Alloy это проходит за несколько минут, поэтому долгий
                рост означает, что старыми стали живые строки. Проверь часы на нодах
                и в поде (сравни timestamp строки с time()), порог older_than в
                helm/values/alloy.yaml и не отстало ли чтение логов. Цена ошибки —
                потеря логов demo/monitoring.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"

  # --- Сторожа самого правила Loki ruler ------------------------------------
  # Правило DemoApi5xxFromLogs живёт вне Prometheus, и до 2026-11-09 его загрузку
  # никто не сторожил: выпавший файл выглядел как «5xx нет». Сторожа — обычные
  # правила Prometheus, опорные метрики — счётчики движка правил Loki с меткой
  # rule_group формата «<файл>;<группа>». В живой метке перед `;` стоит путь к файлу
  # (`file=/tmp/loki-rules/fake/demo-api-5xx.yaml` в логе пода 2026-11-08), в тесте
  # префикс сокращён: селектор смотрит на хвост, и префикс ему безразличен.
  - name: "правило ruler вычисляется: оба сторожа молчат"
    interval: 1m
    input_series:
      - series: 'loki_prometheus_rule_evaluations_total{rule_group="demo-api-5xx.yaml;demo-api-logs"}'
        values: '0+1x40'
      - series: 'loki_prometheus_rule_evaluation_failures_total{rule_group="demo-api-5xx.yaml;demo-api-logs"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: LokiRulerRulesMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: LokiRulerEvaluationFailing
        exp_alerts: []

  # Счётчика вычислений нет вовсе: файл выпал из ConfigMap, не смонтирован в каталог
  # тенанта, ruler выключен или YAML не разбирается. Серия up при этом живая — под
  # Loki работает, логи идут, и без этого правила тишина неотличима от нормы.
  - name: "правила ruler нет в метриках: LokiRulerRulesMissing горит"
    interval: 1m
    input_series:
      - series: 'up{job="monitoring/loki", namespace="monitoring"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: LokiRulerRulesMissing
        exp_alerts:
          - exp_labels:
              namespace: monitoring
              service: loki
              severity: ticket
            exp_annotations:
              summary: "Loki ruler: правило по логам не вычисляется"
              description: >-
                Серии loki_prometheus_rule_evaluations_total для группы demo-api-logs нет
                дольше 10 минут: файл пропал из ConfigMap loki-rules, не смонтирован в
                /etc/loki/rules/fake, ruler выключен или файл не разбирается. Правило
                DemoApi5xxFromLogs при этом молчит, и отличить это от «5xx нет» нечем.
                Падение или rollout пода Loki даёт тот же симптом — тогда рядом горят
                LokiDown/LokiTargetMissing. Проверь ConfigMap loki-rules,
                /prometheus/api/v1/rules на порту 3100 и лог пода Loki.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторож-самого-правила-ruler"
      - eval_time: 20m
        alertname: LokiRulerEvaluationFailing
        exp_alerts: []

  # Группу переименовали, а селектор остался: серия есть, но под другим именем, и
  # селектор её не видит. Сторож обязан сработать — это тот самый дрейф, от которого
  # защищает ассерт в scripts/checks/loki_ruler.py (переименование без правки
  # селектора валит ворота раньше, но и в рантайме сигнал должен быть).
  - name: "группа ruler переименована: LokiRulerRulesMissing горит"
    interval: 1m
    input_series:
      - series: 'loki_prometheus_rule_evaluations_total{rule_group="demo-api-5xx.yaml;demo-api-logs-v2"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: LokiRulerRulesMissing
        exp_alerts:
          - exp_labels:
              namespace: monitoring
              service: loki
              severity: ticket
            exp_annotations:
              summary: "Loki ruler: правило по логам не вычисляется"
              description: >-
                Серии loki_prometheus_rule_evaluations_total для группы demo-api-logs нет
                дольше 10 минут: файл пропал из ConfigMap loki-rules, не смонтирован в
                /etc/loki/rules/fake, ruler выключен или файл не разбирается. Правило
                DemoApi5xxFromLogs при этом молчит, и отличить это от «5xx нет» нечем.
                Падение или rollout пода Loki даёт тот же симптом — тогда рядом горят
                LokiDown/LokiTargetMissing. Проверь ConfigMap loki-rules,
                /prometheus/api/v1/rules на порту 3100 и лог пода Loki.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторож-самого-правила-ruler"
      - eval_time: 20m
        alertname: LokiRulerEvaluationFailing
        exp_alerts: []

  # Правило загружено и вычисления идут, но счётчик ошибок растёт: выражение падает
  # (сменился формат поля, ошибка запроса к хранилищу). Первый сторож в этом случае
  # молчит — и без второго сбой вычисления был бы невидим.
  - name: "вычисление правила ruler падает: LokiRulerEvaluationFailing горит"
    interval: 1m
    input_series:
      - series: 'loki_prometheus_rule_evaluations_total{rule_group="demo-api-5xx.yaml;demo-api-logs"}'
        values: '0+1x40'
      - series: 'loki_prometheus_rule_evaluation_failures_total{rule_group="demo-api-5xx.yaml;demo-api-logs"}'
        values: '0x15 1x25'
    alert_rule_test:
      - eval_time: 25m
        alertname: LokiRulerEvaluationFailing
        exp_alerts:
          - exp_labels:
              namespace: monitoring
              service: loki
              severity: ticket
            exp_annotations:
              summary: "Loki ruler: вычисление правила по логам падает"
              description: >-
                Счётчик loki_prometheus_rule_evaluation_failures_total для группы
                demo-api-logs растёт: правило загружено, но выражение не вычисляется.
                Типичные причины — сменился формат поля (| json | status >= 500), ошибка
                запроса к хранилищу или нехватка ресурсов пода. Пока это так,
                DemoApi5xxFromLogs не горит ни на настоящих 5xx, ни на отсутствии логов.
                Смотри лог пода Loki (rule evaluation failed), /prometheus/api/v1/rules
                на порту 3100 и серии в Loki.
              runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторож-самого-правила-ruler"
      - eval_time: 25m
        alertname: LokiRulerRulesMissing
        exp_alerts: []

  # Сбой был и прекратился: окно 15m теряет приращение, и алерт снимается сам —
  # поэтому в описании правила стоит ~15 минут, а не «висит час».
  - name: "сбой вычисления прекратился: LokiRulerEvaluationFailing молчит"
    interval: 1m
    input_series:
      - series: 'loki_prometheus_rule_evaluations_total{rule_group="demo-api-5xx.yaml;demo-api-logs"}'
        values: '0+1x40'
      - series: 'loki_prometheus_rule_evaluation_failures_total{rule_group="demo-api-5xx.yaml;demo-api-logs"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: LokiRulerEvaluationFailing
        exp_alerts: []
