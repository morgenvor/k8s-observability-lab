apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PrometheusRule'ы проекта. Namespace monitoring и метка release=monitoring
# прописаны в самих объектах: оператор ищет правила по ruleSelector, и без метки
# они не появятся в Prometheus.
#
# Файлы именно CRD, а не «голые» groups: файл из rules/ применяется как обычный
# манифест (`kubectl apply -k .`), а promtool такие CRD читать не умеет — для него
# scripts/check.sh выгружает spec.groups в .tmp/rendered/rulefiles.
resources:
  - demo-slo.yaml
  - demo-slo-alerts.yaml
  - infra.yaml
  - meta.yaml
  - pipeline.yaml
