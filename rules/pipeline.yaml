# Алерты пайплайна логов: Loki (приём и хранение) и Alloy (сбор и отправка).
#
# Зачем: до 2026-11-07 у этих компонентов не было ни одного своего алерта и ни одного
# ServiceMonitor. Косвенно их жизнь была видна только через kube-state-metrics
# (KubeStatefulSetReplicasMismatch, KubePodNotReady, KubeDaemonSet*), но:
#   * удаление объекта (STS/DS) убирает и серию kube_* — все алерты чарта замолкают;
#   * «жив, но не работает» (Loki не принимает строки, Alloy их теряет) не видно вообще:
#     метрики в /metrics никто не скрейпил.
# Поэтому первым шагом включены ServiceMonitor'ы (helm/values/loki.yaml,
# helm/values/alloy.yaml), вторым — эти правила.
#
# Метка job у двух компонентов разная, и это не опечатка:
#   * Loki: шаблон чарта переписывает job в "monitoring/<service>" (relabeling
#     job -> monitoring/$1), поэтому job="monitoring/loki";
#   * Alloy: шаблон чарта job не трогает, job = имя Service ("alloy").
# Проверять не глазами, а `.tmp/rendered/helmfile.yaml` и живым /api/v1/targets.
#
# Severity по контракту проекта: page — SLO burn-rate fast, SloRulesAbsent и
# SloAlertRulesAbsent (отказ сервиса и его страниц), ticket — событие для планового
# разбора. Свои info
# не ставим: ингибитор чарта (source: InfoInhibitor, target: severity="info", equal:
# namespace) глушит одиночный info, и такой алерт до sink не доходит вовсе —
# проверено на стенде 2026-11-10 (rules/meta.yaml, LoadGeneratorThrottled). Слепота,
# за которой больше нет сигнала, — ticket: heartbeat пути уведомлений, сторожа
# правила ruler, этот пайплайн.
# Логи не источник истины о доступности demo-api, поэтому отказ Loki/Alloy — ticket,
# а не page: SLO продолжает считаться по метрикам.
# Маршрут — дерево по severity (deploy/monitoring/alertmanagerconfig.yaml):
# page|critical → e-mail, ticket|info|warning|none → alert-sink. То есть severity
# здесь и метка для человека, и переключатель канала.
#
# Дубли, которые остаются осознанно: при падении цели чарт параллельно поднимает
# TargetDown (warning, for: 10m) и правила kube-state-metrics (KubePodNotReady,
# KubeStatefulSetReplicasMismatch, KubeDaemonSet*), поэтому одно событие даёт две-три
# записи в /timeline. Свои правила срабатывают раньше (5m) и различают «цель есть,
# но не отвечает» и «цели нет вовсе» — TargetDown видит только up == 0. Отключить
# TargetDown точечно нельзя (правило чарта общее для всех job), а цена дубля —
# лишняя запись, не лишний page: warning и ticket идут в один sink.
#   * падение или rollout пода Loki прячет и метрики ruler, поэтому
#     LokiRulerRulesMissing сработает рядом с LokiDown/LokiTargetMissing — так же
#     осознанно: первый говорит «правило не считается», вторые — «Loki не отвечает».
#
# Чего здесь сознательно нет:
#   * отдельного AlloyNotSending — «Alloy не отправляет» и «Loki не принимает» с точки
#     зрения наблюдаемости одно и то же; конец цепочки проверяет LokiNotIngesting,
#     а потери на стороне Alloy точнее ловит AlloyDroppedLogs (там есть причина);
#   * проверки самого Loki по /ready — нет метрики, только HTTP-статус; это работа
#     для blackbox exporter, которого в проекте нет (вне объёма v1.0/v1.1);
#   * алерта на «старые логи в Loki» (retention не работает) — retention проверяется
#     косвенно: PVC 5Gi + PVCNearlyFull, а compactor-ошибки видны как рост PVC.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-logs-pipeline
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: demo-logs-pipeline
    app.kubernetes.io/part-of: k8s-observability-lab
spec:
  groups:
    - name: demo-logs-pipeline.loki
      rules:
        # Пара «цель есть, но не отвечает» и «цели нет вовсе» проверяется двумя
        # правилами намеренно — как в meta.yaml: отсутствие серии up означает не
        # «up=0», а «скрейпить нечего», и `up == 0` в этом случае не сработает
        # никогда. Когда под Loki удалён или у него нет Ready-эндпоинта, цель
        # исчезает за секунды, и единственный сигнал — absent().
        - alert: LokiDown
          expr: up{job="monitoring/loki", namespace="monitoring"} == 0
          for: 5m
          labels:
            severity: ticket
            service: loki
            namespace: monitoring
          annotations:
            summary: "Loki: цель скрейпа не отвечает"
            description: >-
              /metrics Loki не отдаёт метрики дольше 5 минут при живой цели: процесс
              завис или упёрся в память. Grafana в это время не читает логи, а Alloy
              копит ошибки push. Проверь под loki-0, kubectl logs и /ready.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
        - alert: LokiTargetMissing
          expr: absent(up{job="monitoring/loki", namespace="monitoring"})
          for: 10m
          labels:
            severity: ticket
            service: loki
            namespace: monitoring
          annotations:
            summary: "Loki: цели скрейпа нет вовсе"
            description: >-
              Серии up{job="monitoring/loki"} нет 10 минут: удалён StatefulSet или
              Service, выключен ServiceMonitor, либо у Service нет готовых
              эндпоинтов. В отличие от up == 0 это не «сломанный скрейп», а
              «нечего скрейпить» — молчание не означает здоровье.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
        # Конец цепочки logs: Alloy -> Loki. Если строки перестали приходить при
        # живом Loki, сломано звено выше (Alloy, RBAC, сеть, config) — либо в лабе
        # выключен сам демо-контур. Для demo/monitoring непрерывная запись — норма,
        # поэтому тишина считается дефектом и уходит ticket: одиночный info глушит
        # InfoInhibitor (см. шапку), то есть прежний info не доставлялся вообще.
        # Падение Alloy ловят отдельные правила ниже — здесь именно «строк нет».
        - alert: LokiNotIngesting
          expr: sum(rate(loki_distributor_lines_received_total[15m])) == 0
          for: 30m
          labels:
            severity: ticket
            service: loki
            namespace: monitoring
          annotations:
            summary: "Loki: строки не поступают"
            description: >-
              За 15 минут distributor Loki не принял ни одной строки, и так уже 30
              минут. Проверь Alloy (DaemonSet 2/2, его логи), push-URL
              loki.monitoring.svc:3100 и фильтр __meta_kubernetes_pod_node_name;
              если всё цело — возможно, выключен демо-контур: для лабы непрерывная
              запись логов — норма, поэтому тишина считается дефектом.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"

        # Сторож самого правила ruler. У правил Prometheus такой есть (rules/meta.yaml),
        # у единственного логового правила его не было: выпавший из ConfigMap, не
        # смонтированный в /etc/loki/rules/fake, невалидный или выключенный вместе с
        # ruler файл оставляет под Loki живым, up == 1 и логи идущими — и правило
        # DemoApi5xxFromLogs просто молчит. Отличить «правило не загружено» от
        # «5xx нет» было нечем, и это ровно тот класс поломки, против которого заведены
        # ворота проекта.
        #
        # Опорная метрика — счётчик движка правил Prometheus с префиксом loki_;
        # существование и метка rule_group подтверждены живым замером 2026-11-08
        # (docs/verification.md). Формат rule_group — «<файл>;<имя группы>»; префикс —
        # путь к файлу правила, и фиксировать его в выражении незачем, поэтому
        # селектор по хвосту регуляркой. Группа «demo-api-logs» берётся из
        # deploy/loki-rules/demo-api-5xx.yaml, и совпадение имён проверяет
        # scripts/checks/loki_ruler.py (иначе переименование группы тихо отключит
        # сторожа).
        - alert: LokiRulerRulesMissing
          expr: sum(absent(loki_prometheus_rule_evaluations_total{rule_group=~"(.*;)?demo-api-logs"})) > 0
          for: 10m
          labels:
            severity: ticket
            service: loki
            namespace: monitoring
          annotations:
            summary: "Loki ruler: правило по логам не вычисляется"
            description: >-
              Серии loki_prometheus_rule_evaluations_total для группы demo-api-logs нет
              дольше 10 минут: файл пропал из ConfigMap loki-rules, не смонтирован в
              /etc/loki/rules/fake, ruler выключен или файл не разбирается. Правило
              DemoApi5xxFromLogs при этом молчит, и отличить это от «5xx нет» нечем.
              Падение или rollout пода Loki даёт тот же симптом — тогда рядом горят
              LokiDown/LokiTargetMissing. Проверь ConfigMap loki-rules,
              /prometheus/api/v1/rules на порту 3100 и лог пода Loki.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторож-самого-правила-ruler"
        # Второй случай — правило загружено, но выражение падает на вычислении (например,
        # после смены формата поля в логах или при ошибке запроса к хранилищу). Тогда
        # счётчик вычислений растёт, а счётчик ошибок — тоже; первый сторож молчит.
        # Окно 15m + for 5m: одиночный сбой вычисления уже дефект (цикл правила не
        # посчитан), но алерт сам снимается через ~15 минут после последнего сбоя и не
        # висит час. sum() убирает метку rule_group из алерта: путь к файлу правила —
        # мусор для человека и лишняя кардинальность в /timeline. ticket, а не page:
        # сам отказ сервиса виден в SLO, здесь — слепота логового уточнения.
        - alert: LokiRulerEvaluationFailing
          expr: |
            sum(increase(loki_prometheus_rule_evaluation_failures_total{
              rule_group=~"(.*;)?demo-api-logs"
            }[15m])) > 0
          for: 5m
          labels:
            severity: ticket
            service: loki
            namespace: monitoring
          annotations:
            summary: "Loki ruler: вычисление правила по логам падает"
            description: >-
              Счётчик loki_prometheus_rule_evaluation_failures_total для группы
              demo-api-logs растёт: правило загружено, но выражение не вычисляется.
              Типичные причины — сменился формат поля (| json | status >= 500), ошибка
              запроса к хранилищу или нехватка ресурсов пода. Пока это так,
              DemoApi5xxFromLogs не горит ни на настоящих 5xx, ни на отсутствии логов.
              Смотри лог пода Loki (rule evaluation failed), /prometheus/api/v1/rules
              на порту 3100 и серии в Loki.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторож-самого-правила-ruler"

    - name: demo-logs-pipeline.alloy
      rules:
        - alert: AlloyDown
          expr: up{job="alloy", namespace="monitoring"} == 0
          for: 5m
          labels:
            severity: ticket
            service: alloy
            namespace: monitoring
          annotations:
            summary: "Alloy: реплика не отдаёт метрики"
            description: >-
              Одна из реплик DaemonSet alloy не скрейпится дольше 5 минут: логи
              подов этой ноды не собираются. Проверь под на нужной ноде, его логи и
              статус DaemonSet.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
        - alert: AlloyTargetMissing
          expr: absent(up{job="alloy", namespace="monitoring"})
          for: 10m
          labels:
            severity: ticket
            service: alloy
            namespace: monitoring
          annotations:
            summary: "Alloy: целей скрейпа нет вовсе"
            description: >-
              Серии up{job="alloy"} нет 10 минут: удалён DaemonSet или Service,
              выключен ServiceMonitor, либо у сервиса нет эндпоинтов. Сбор логов
              при этом стоит полностью, а не частично.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
        # DaemonSet читает логи каждой ноды своей репликой, поэтому «меньше целей,
        # чем нод» — это дыра в покрытии, даже когда уцелевшая реплика жива.
        # Сравнение с kube_node_info, а не с replicas DaemonSet: число нод — факт,
        # а status.numberReady DaemonSet'а обнуляется вместе с самим объектом.
        - alert: AlloyCoverageIncomplete
          expr: sum(up{job="alloy", namespace="monitoring"}) < count(kube_node_info)
          for: 15m
          labels:
            severity: ticket
            service: alloy
            namespace: monitoring
          annotations:
            summary: "Alloy: реплик меньше, чем нод"
            description: >-
              Живых целей alloy меньше, чем нод в кластере: логи части нод не
              собираются. Типичные причины — под не встал (ресурсы, taint),
              реплика не скрейпится или DaemonSet кем-то урезан по nodeSelector.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
        # Единственный сигнал о потере логов на стороне отправителя: причины из
        # reason= (queue_is_full, rate_limited, ingester_error, ...) прямо говорят,
        # что чинить. Счётчик не растёт в норме, поэтому порог «больше нуля».
        # Граница, о которой надо знать: одна партия потерь не горит. `for: 10m` равен
        # окну rate[10m], поэтому одиночное приращение держит условие примерно окно —
        # срабатывание зависит от фазы опроса. Алерт про УСТОЙЧИВУЮ потерю (счётчик
        # растёт непрерывно); нужна реакция на одиночный всплеск — уменьшать `for`.
        - alert: AlloyDroppedLogs
          expr: |
            sum by (reason) (
              rate(loki_write_dropped_entries_total{job="alloy", namespace="monitoring"}[10m])
            ) > 0
          for: 10m
          labels:
            severity: ticket
            service: alloy
            namespace: monitoring
          annotations:
            summary: "Alloy теряет логи (reason={{ $labels.reason }})"
            description: >-
              Alloy выбрасывает записи дольше 10 минут: очередь переполнена, Loki
              отвечает ошибками или режет лимитами. Логи demo/monitoring теряются
              безвозвратно — это не задержка, а пропуск. Смотри reason и логи Alloy.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
        # Тот же класс потери, но с другой стороны фильтра: stage.drop в Alloy
        # (helm/values/alloy.yaml) выбрасывает строки старше 50 минут. После
        # пересоздания пода это норма — логи перечитываются с начала, — но счётчик
        # вырастет и тогда, когда «старыми» станут живые строки: уехали часы на ноде,
        # конфиг собрали с неверным порогом, контейнер долго не читался. Без правила
        # такая потеря не видна никому: up == 1, Loki отвечает 200, AlloyDroppedLogs
        # (это loki_write_dropped_entries_total) молчит — потерь на отправке нет.
        # rate за 15 минут + for 30m: всплеск после рестарта затухает вместе с окном
        # rate и до 30 минут не дотягивает, устойчивая потеря горит. Расчёт закреплён
        # тестами rules/tests/pipeline.test.yaml, а не только этим комментарием.
        - alert: AlloyOldLogsDropped
          expr: |
            sum by (instance) (
              rate(loki_process_dropped_lines_total{
                job="alloy", namespace="monitoring", reason="too_old"
              }[15m])
            ) > 0
          for: 30m
          labels:
            severity: ticket
            service: alloy
            namespace: monitoring
          annotations:
            summary: "Alloy выбрасывает старые строки дольше 30 минут"
            description: >-
              Фильтр stage.drop отбрасывает строки старше порога `older_than` из
              helm/values/alloy.yaml непрерывно:
              после рестарта Alloy это проходит за несколько минут, поэтому долгий
              рост означает, что старыми стали живые строки. Проверь часы на нодах
              и в поде (сравни timestamp строки с time()), порог `older_than` в
              values и не отстало ли чтение логов. Цена ошибки —
              потеря логов demo/monitoring.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#пайплайн-логов"
