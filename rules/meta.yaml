# Мета-алерты: следят не за сервисом, а за самой системой оповещения (фаза 3).
#
# Из плана сюда входили три правила; два не созданы сознательно, потому что чарт
# kube-prometheus-stack поставляет их под теми же именами, и дубль дал бы по два
# уведомления на одно событие (решение владельца 2026-11-03, см. CHANGELOG):
#   * Watchdog — general.rules (vector(1), всегда firing, проверяется приёмником);
#   * AlertmanagerConfigReloadFailed — alertmanager.rules как AlertmanagerFailedReload.
#
# Остаётся то, чего у чарта нет: контроль того, что наши SLO-правила вообще
# вычисляются. Это «сторож сторожа»: если PrometheusRule demo-slo не загрузился
# или группа падает, burn-rate алерты молчат — и без этого правила тишина
# выглядела бы как здоровый сервис.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-meta
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: demo-meta
    app.kubernetes.io/part-of: k8s-observability-lab
spec:
  groups:
    - name: demo-meta.pipeline
      rules:
        # absent() ловит именно отсутствие вычисленной серии: PrometheusRule не
        # загружен, выключен или его не видит ruleSelector. Падение группы на
        # вычислении покрывает правило чарта PrometheusRuleFailures, поэтому «чего у
        # чарта нет» здесь — ровно случай «правил нет / они не подхватились».
        # Обе серии проверяются отдельно: поломка группы demo-slo.latency иначе
        # осталась бы незамеченной (availability-правила продолжали бы работать).
        # Нулевой трафик серию НЕ убирает: при живых счётчиках и нулевой скорости
        # ratio даёт NaN, а если счётчиков ещё нет — хвостовой `or vector(1)` отдаёт 1.
        # В обоих случаях серия есть, поэтому absent() здесь молчит, а SLO выглядит
        # здоровым. Этот случай ловит SloDemoNoTraffic ниже — он смотрит на сырые
        # метрики нагрузки, а не на записанные slo:*.
        - alert: SloRulesAbsent
          expr: |
            absent(slo:demo_availability:ratio_5m)
            or absent(slo:demo_latency:ratio_5m)
          for: 10m
          labels:
            severity: page
            service: demo-api
            namespace: demo
          annotations:
            summary: "SLO-правила demo не вычисляются в Prometheus"
            description: >-
              Серии slo:demo_availability:ratio_5m или slo:demo_latency:ratio_5m
              отсутствуют дольше 10 минут: PrometheusRule demo-slo не загружен
              (нет метки release=monitoring?), группа падает на вычислении или
              оператор ещё не перезагрузил правило. Пока это так, burn-rate
              алерты по SLO молчат — тишина не означает «всё хорошо».
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторожа-правил-и-slo-meta"

        # Второй сторож — со стороны алертов. SloRulesAbsent выше проверяет
        # записанные серии slo:*: если они живы, группы demo-slo.* вычисляются.
        # Но страницы живут в другой группе — demo-slo-alerts
        # (demo-slo.alerts.availability и demo-slo.alerts.latency): если она не
        # загрузилась или падает, записанные slo:* остаются, а burn-rate алерты
        # молчат, и тишина снова выглядит как здоровый сервис. Остальные группы
        # (demo-infra, demo-meta, demo-logs-pipeline, demo-alerting-path) проверяет
        # только гейт деплоя scripts/deploy.sh — один раз после apply он сверяет
        # число групп, выведенное из rules/*.yaml. Рантайм-сторожа у них нет: если
        # группа исчезнет после выкатки
        # (удалён PrometheusRule, сломался ruleSelector), этого не заметит никто.
        # Ограничение записано осознанно: сторож «все 10 групп» требует способа задать
        # ожидаемое число без дрейфа, иначе константа в выражении устареет молча.
        # Правило по логам в Loki сторожат свои правила — rules/pipeline.yaml
        # (LokiRulerRulesMissing, LokiRulerEvaluationFailing).
        # Метка rule_group в Prometheus 3.15.1 — «<путь к файлу правил>;<имя группы>»
        # (проверено на стенде 2026-11-07), поэтому селектор — по хвосту регуляркой:
        # в пути есть UID PrometheusRule, он меняется при пересоздании объекта.
        - alert: SloAlertRulesAbsent
          expr: |
            sum(absent(prometheus_rule_group_rules{rule_group=~".*;demo-slo[.]alerts[.]availability"}))
            or
            sum(absent(prometheus_rule_group_rules{rule_group=~".*;demo-slo[.]alerts[.]latency"}))
          for: 10m
          labels:
            severity: page
            service: demo-api
            namespace: demo
          annotations:
            summary: "Burn-rate алерты demo не загружены в Prometheus"
            description: >-
              Групп demo-slo.alerts.availability или demo-slo.alerts.latency нет в
              памяти Prometheus дольше 10 минут: PrometheusRule demo-slo-alerts не
              подхватился (нет метки release=monitoring?), группа падает или её
              выкинул оператор. Записанные серии slo:* при этом живы, поэтому
              SloRulesAbsent молчит, а страниц по бюджету ошибок нет вовсе — тишина
              не означает «всё хорошо».
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторожа-правил-и-slo-meta"

        # Третий сторож с другой стороны. SloRulesAbsent ловит «правил нет», а это
        # правило — «правила есть, а судить не о чем». Нужно потому, что SLI нормируется
        # на трафик: без запросов доля ошибок даёт NaN (счётчики есть, скорость нулевая)
        # или 1 (счётчиков ещё нет и сработал хвостовой `or vector(1)`), и дашборд
        # выглядит зелёным. Отсутствие клиентов само по себе — не инцидент (в реальной
        # системе это ночь или праздники), поэтому severity: info: для лабы это дефект
        # фикстуры, а не отказ сервиса. Пропажу demo-api при живом генераторе это
        # правило не покрывает и не должно: её видно как error/timeout в бюджете
        # доступности.
        - alert: SloDemoNoTraffic
          expr: |
            (
              (sum(up{job="demo-load"}) > 0)
              unless
              (sum(rate(load_requests_total{job="demo-load"}[10m])) > 0)
            )
            # sum() вокруг absent(): в Prometheus 3.x absent() возвращает метки
            # равенства из селектора (job="demo-load"), иначе алерт получил бы
            # лишнюю метку, которой нет у ветки с живой целью.
            or
            sum(absent(up{job="demo-load"})) > 0
          for: 15m
          labels:
            severity: info
            service: demo-api
            namespace: demo
          annotations:
            summary: "demo-api: SLI считается без трафика нагрузки"
            description: >-
              demo-load жив (up=1), но за последние 10 минут не отправил ни одного
              запроса — либо цель demo-load пропала из Prometheus совсем. Записанные
              серии slo:* при этом не пустеют: при нулевой скорости они дают NaN или 1,
              поэтому дашборд выглядит зелёным, хотя оценивать нечего. Проверь под
              demo-load, его логи и load_ticks_skipped_total, а также конфиг toxiproxy.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#сторожа-правил-и-slo-meta"

    # Троттлинг генератора — сторож того же класса, но с другой стороны: не
    # «правил нет», а «прибор врёт». SLI считаются по клиентским метрикам
    # demo-load, поэтому заморозка его cgroup попадает прямо в бюджет ошибок.
    # Разбор 2026-11-09: при limits.cpu=100m контейнер был заморожен в 26-37 %
    # периодов CFS, длительности квантовались по ~100 мс, 9 % запросов выходили за
    # 300 мс, 2 % — за клиентский timeout 1 с; при этом у demo-api не было ни одной
    # ошибки и серверный p99 был 19 мс.
    #
    # Почему своё правило, а не чартовый CPUThrottlingHigh: тот имеет severity=info,
    # а все info-алерты глушит ингибитор чарта (source: InfoInhibitor, target:
    # severity="info", equal: namespace) — в namespace demo он горит всегда, когда
    # горит любой info. Проверено на стенде: CPUThrottlingHigh был firing 07.11
    # с 20:25 до 22:00 MSK, а до alert-sink не дошёл ни один экземпляр.
    #
    # Селекторы намеренно без job/metrics_path: жёсткий фильтр
    # container!="" + job="kubelet" + metrics_path="/metrics/cadvisor" — то место,
    # где чартовое правило ломается при смене scrape-конфига. Отношение не зависит
    # от числа источников: числитель и знаменатель масштабируются одинаково.
    - name: demo-meta.generator
      rules:
        - alert: LoadGeneratorThrottled
          expr: |
            sum by (namespace, pod) (
              rate(container_cpu_cfs_throttled_periods_total{
                namespace="demo", pod=~"demo-load-.*", container!=""}[5m])
            )
            /
            sum by (namespace, pod) (
              rate(container_cpu_cfs_periods_total{
                namespace="demo", pod=~"demo-load-.*", container!=""}[5m])
            ) > 0.1
          for: 10m
          labels:
            severity: ticket
            service: demo-api
            namespace: demo
          annotations:
            summary: "demo-api: генератор нагрузки троттлится, SLI считает его простой"
            description: >-
              Контейнер demo-load выбирает квоту CPU больше чем в 10 % периодов CFS
              дольше 10 минут. Это не отказ сервиса, а дефект прибора: SLI считаются
              по клиентским метрикам генератора, поэтому заморозка контейнера уходит
              в бюджет ошибок доступности и латентности — длительности квантуются по
              ~100 мс, растут timeout и доля запросов дольше 300 мс, а demo-api при
              этом отвечает за единицы миллисекунд. Поднимай limits.cpu пода
              demo-load, а не ищи причину в demo-api.
            runbook_url: "https://github.com/morgenvor/k8s-observability-lab/blob/main/docs/runbook.md#троттлинг-генератора-нагрузки"
