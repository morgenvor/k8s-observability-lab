# Values Grafana Loki для лабы: одна реплика SingleBinary, файловая система, retention 72h.
# Чарт: grafana/loki 7.5.0 — пин в helmfile.yaml. Источник дефолтов: values.yaml чарта
# 7.5.0. Важно: appVersion чарта 3.6.16, а его values пинят образ тегом 3.6.11 — образ
# ниже задан явно, чтобы смена чарта не меняла образ молча (registry в лабе нет).
#
# Почему SingleBinary: в лабе 2 ноды по ~2,9–3,8 GiB и один тенант без HA. SimpleScalable
# (read/write/backend) требует объектного хранилища, а MinIO в лабе не поднимаем —
# логи не источник истины, диск под них один. SingleBinary с filesystem даёт весь набор
# компонентов (distributor, ingester, querier, compactor) в одном процессе.
# Чарт сам запрещает >1 реплики SingleBinary без объектного хранилища (validate.yaml).
deploymentMode: SingleBinary

loki:
  # Один тенант: X-Scope-OrgID и заголовки не нужны ни Alloy, ни Grafana.
  auth_enabled: false
  # Образ пиннится явно: 3.6.11 — та версия, что импортирована в containerd лабы
  # (appVersion чарта 7.5.0 = 3.6.16, дефолт чарта не используется). Новая версия =
  # правка здесь + IMPORT_IMAGES на обе ноды.
  image:
    tag: 3.6.11
  commonConfig:
    # Одна реплика = один писатель; иначе Loki ждёт кворум и не стартует.
    replication_factor: 1
  storage:
    type: filesystem
  # Схема индекса задаётся нами: чарт 7.5.0 падает с "You must provide a schema_config",
  # дефолта (осознанно) нет — схема зависит от хранилища. tsdb + v13 — текущая
  # рекомендуемая для 3.x, filesystem совпадает с loki.storage.type выше.
  # Проверено: без этого блока helmfile template падает (см. CHANGELOG фазы 5).
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # Совпадает с окном SLO и Prometheus retention: логи нужны на те же 3 суток дриллов.
    retention_period: 72h
  # Ruler (фаза 5 v1.1): правило по логам — второй класс проверки рядом с метриками
  # Prometheus. Чарт 7.5.0 мержит наш rulerConfig поверх вычисленного storage
  # (`mergeOverwrite` в шаблоне loki.rulerConfig), поэтому storage задаётся здесь.
  rulerConfig:
    # Alertmanager того же стека: Service релиза monitoring, порт 9093. Правила уходят
    # тем же деревом маршрутов, что и алерты Prometheus (severity: ticket → alert-sink).
    alertmanager_url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
    # GET /prometheus/api/v1/rules на порту 3100 — единственный способ офлайн-класса
    # увидеть, что правило реально загрузилось; без этого флага ручка не поднимается.
    enable_api: true
    # Дефолт rule_path — /rules, но этот путь в поде не смонтирован, а root FS
    # readOnlyRootFilesystem: true. /tmp — emptyDir из шаблона StatefulSet, туда писать можно.
    rule_path: /tmp/loki-rules
    storage:
      type: local
      # Каталог читает локальное хранилище правил; файлы приезжают из ConfigMap
      # loki-rules (deploy/loki-rules) — см. singleBinary.extraVolumeMounts ниже.
      local:
        directory: /etc/loki/rules
  # Retention в Loki удаляет только compactor: без этого блока limits_config
  # retention_period игнорируется, а PVC 5Gi забивается до ReadOnly.
  compactor:
    retention_enabled: true
    # Loki 3.x требует явный store для delete-запросов при включённом retention;
    # filesystem — тот же бэкенд, что и у чанков (объектного хранилища в лабе нет).
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

# Один под на PVC 5Gi (см. AGENTS) под 72 ч логов демо-контура.
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Правила Loki ruler — ConfigMap loki-rules из deploy/loki-rules, только на чтение.
  # Том монтируется сразу в подкаталог тенанта: локальное хранилище правил читает
  # `<directory>/<tenant>/<файл>`, а при auth_enabled: false тенант — "fake"
  # (docs Loki, multi-tenancy). Имя ключа ConfigMap в тенанта превратить нельзя:
  # в ключах ConfigMap слэш недопустим, а mountPath — можно.
  extraVolumes:
    - name: loki-rules
      configMap:
        name: loki-rules
  extraVolumeMounts:
    - name: loki-rules
      mountPath: /etc/loki/rules/fake
      readOnly: true
  persistence:
    # Явно, хотя дефолт чарта — true: PVC 5Gi и его удаление при destroy — часть
    # контракта отката фазы 5, а не случайная деталь values.
    enabled: true
    size: 5Gi
    # 2026-11-07: когда StatefulSet масштабируют в 0, том НЕ удаляется.
    # Дефолт чарта — whenScaled: Delete, и это не теория: дрилл «Loki пропал»
    # (`kubectl scale sts loki --replicas=0`) удалил PVC storage-loki-0 вместе с
    # логами за ~2 суток, а при возврате реплики создался пустой том. Для лабы логи
    # не источник истины, но проверка алерта не должна стоить данных: любой
    # «остановить компонент и посмотреть, сработает ли алерт» — штатный сценарий.
    # whenDeleted оставлен Delete (дефолт): удаление релиза (`helmfile destroy`)
    # по-прежнему убирает том — это контракт отката, он зафиксирован в AGENTS/runbook.
    whenScaled: Retain
    whenDeleted: Delete

# Таргеты SimpleScalable (read/write/backend) в values чарта по умолчанию = 3 реплики,
# и чарт падает на «replicas configured for both single binary and simple scalable»,
# пока они не обнулены. Это не «выключение компонентов», а выбор режима SingleBinary.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Кеши выключаем: каждый чарт-кеш — отдельный memcached StatefulSet, а у нас
# ~10 строк/с (5 rps demo-load + столько же demo-api) и лимит памяти ноды. Без кешей
# Loki работает, просто медленнее на чтении.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Gateway (nginx) не нужен: auth выключен, запросы идут напрямую на Service `loki:3100`.
gateway:
  enabled: false

# Canary пишет тестовые строки в тот же Loki (лишние streams и память), а helm-тест
# требует canary — поэтому выключаем обоих. Проверка работоспособности — живыми
# запросами из Grafana (план, шаг «живое»).
lokiCanary:
  enabled: false
test:
  enabled: false

# Ruler включён явно (дефолт чарта — тоже true): с v1.1 в нём живёт правило по логам
# `DemoApi5xxFromLogs` (deploy/loki-rules). Раньше здесь было «правил у проекта нет».
ruler:
  enabled: true

# Sidecar, который ищет ConfigMap/Secret с меткой loki_rule, по-прежнему не нужен:
# правило приезжает из своего ConfigMap прямым томом (см. singleBinary.extraVolumes).
# Sidecar стоил бы лишнего контейнера в поде и RBAC на чтение чужих объектов.
sidecar:
  rules:
    enabled: false

# Self-monitoring и MinIO в чарте по умолчанию и так выключены; фиксируем явно,
# чтобы смена дефолтов чарта не притащила в лабу лишние поды и PVC.
monitoring:
  selfMonitoring:
    enabled: false
  # 2026-11-07: метрики Loki в Prometheus. До этого ServiceMonitor не создавался, и
  # у Prometheus не было даже серии up{job=...}: падение Loki и прекращение приёма
  # логов были невидимы (косвенно ловился только под/STS, и молча — если объект
  # удалён). Цена: ~2,2 тыс. серий /metrics (+~70–80 МБ TSDB на 72 ч при 30s).
  # Метка release=monitoring обязательна: serviceMonitorSelector Prometheus —
  # matchLabels release=monitoring (проверено на живом CR).
  # ВАЖНО про job: шаблон чарта переписывает job в "monitoring/<service>", поэтому
  # правила в rules/pipeline.yaml смотрят на job="monitoring/loki".
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring
    # 30s = scrapeInterval стека; дефолт чарта 15s рассчитан на его recording rules,
    # которых у нас нет.
    interval: 30s
    scrapeTimeout: 10s
minio:
  enabled: false
