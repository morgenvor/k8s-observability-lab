# Values Grafana Alloy для лабы: DaemonSet, логи подов через Kubernetes API.
# Чарт: grafana/alloy 1.15.0 (app v1.21.3) — пин чарта в helmfile.yaml, образ пинится ниже.
#
# Почему loki.source.kubernetes, а не loki.source.file по hostPath /var/log/pods:
# hostPath требует root/privileged и привязывает конфиг к раскладке containerd ноды.
# API-путь работает от обычного ServiceAccount с RBAC по `pods`/`pods/log`.
alloy:
  configMap:
    content: |
      // Поды-цели берём только в двух namespace: kube-system в 5 GiB и 72 ч не
      // помещается и для дриллов не нужен.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["demo", "monitoring"]
        }
      }

      // Метки низкой кардинальности. Всё, что не перечислено (pod_template_hash,
      // controller_revision_hash, __meta_kubernetes_pod_uid), в метки потоков не попадает
      // вовсе: они остаются только в целях discovery и нужны одному loki.source.kubernetes,
      // чтобы понять, чьи логи читать. Такой «выброс» дешевле, чем отдельные labeldrop.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Регекспы ниже анкорятся целиком (семантика relabel): "demo|monitoring"
        // совпадает только с этими двумя именами, а не с "demo-2".
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "demo|monitoring"
          action        = "keep"
        }
        // Каждая реплика читает только поды своей ноды. Без этого правила все поды
        // DaemonSet'а видят один и тот же список подов кластера и читают логи дважды
        // (факт 2026-11-04: 24–25 targets на каждой реплике при ~13 подах).
        // K8S_NODE_NAME чарт подаёт из spec.nodeName.
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // Оба имени: app.kubernetes.io/name — стандарт k8s, app — метка, которую
        // используют манифесты демо-контура и запросы в этом плане.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app_kubernetes_io_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        // Кластер в метке, а не в external_labels: строка метки видна в Grafana и не
        // зависит от настроек loki.write.
        rule {
          target_label = "cluster"
          replacement  = "lab-k3s"
        }
      }

      // Отсекаем строки старше 50 минут — до записи в Loki, а не после отказа.
      // Причина: позиции чтения лежат в emptyDir, после пересоздания пода Alloy
      // перечитывает лог контейнера с начала, а Loki отвергает записи слишком старого
      // timestamp. Окно Loki (v3.6.x): cutoff = newest_ts - ingester.max-chunk-age/2,
      // при дефолтах unordered-writes=true и max-chunk-age=2h это ровно 1 час
      // (pkg/ingester/stream.go, validateEntries -> ErrTooFarBehind).
      // Порог равен окну — ошибка: батч, ушедший в Loki с задержкой, попадает за границу
      // и всё равно получает 400. Поэтому 50 минут: 10 минут запаса на батчинг и
      // повторные попытки. Цена запаса — строки 50–60 минут давности не доедут, хотя
      // Loki принял бы их: для дриллов (окна минуты–десятки минут) и разбора алертов
      // это не значимо, для ретроспективы старше часа — тем более.
      // Почему не том: hostPath требует root (запрещено решением AGENTS), а PVC в
      // DaemonSet без отдельного PV на ноду не масштабируется на вторую ноду.
      // Почему не retention in Loki: он отбрасывает уже принятое, а отказа на приёме
      // ("entry too far behind") это не снимает.
      loki.process "drop_old" {
        forward_to = [loki.write.local.receiver]

        stage.drop {
          older_than          = "50m"
          drop_counter_reason = "too_old"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.drop_old.receiver]
      }

      loki.write "local" {
        endpoint {
          // SingleBinary: gateway в Loki выключен, пишем прямо в его Service.
          // Второй экземпляр адреса — datasource Grafana в helm/values/kps.yaml.
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
  # Образ пиннится тегом: registry в лабе нет, и молчаливая смена образа при
  # обновлении чарта даёт ImagePullBackOff (этот сценарий уже был). Новая версия —
  # правка здесь + IMPORT_IMAGES в scripts/import-image.sh.
  image:
    tag: v1.21.3
  # Даже BestEffort-Alloy на ноде с ~1 Gi запаса может быть вытеснен первым;
  # запросы маленькие, лимит держит OOM под контролем (план: 500–700 Mi на Loki+Alloy).
  # Лимит 192Mi оказался впритык: живой замер после фильтра по ноде дал 137–154 Mi
  # в контейнере alloy (≈80 % лимита) — подняли до 256Mi, чтобы дриллы фазы 6 не
  # ловили OOMKill на ровном месте.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Контейнер Alloy в образе не задаёт USER, поэтому без этого блока под работает
  # root'ом — вопреки «без hostPath и root» в AGENTS/runbook. Повторяем hardening,
  # который чарт уже применяет к config-reloader (UID/GID 65534).
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  # Позиции чтения (--storage.path=/tmp/alloy) при readOnlyRootFilesystem требуют
  # writable-тома. Он emptyDir: после пересоздания пода Alloy логи контейнеров читаются
  # с начала, а строки старше порога отбрасывает loki.process "drop_old" выше — иначе
  # Loki отвечал бы на них 400 «entry too far behind».
  mounts:
    extra:
      - name: alloy-data
        mountPath: /tmp/alloy

# Pod-level hardening для обоих контейнеров пода (alloy + config-reloader).
global:
  podSecurityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

# DaemonSet — дефолт чарта, фиксируем явно: одна реплика на ноду читает логи подов
# этой ноды (фильтр по __meta_kubernetes_pod_node_name в конфиге выше).
controller:
  type: daemonset
  volumes:
    extra:
      - name: alloy-data
        emptyDir: {}

# 2026-11-07: метрики Alloy в Prometheus (раньше ServiceMonitor не создавался, и
# «Alloy жив, но не отправляет» было невидимо — ни up, ни loki_write_* в Prometheus).
# Метка release=monitoring обязательна: serviceMonitorSelector Prometheus —
# matchLabels release=monitoring. job здесь = имя Service ("alloy"): шаблон чарта
# job не переписывает (в отличие от Loki), это учтено в rules/pipeline.yaml.
# Метрик немного (~270 на реплику), но они дают единственный сигнал о выброшенных
# логах: loki_write_dropped_entries_total{reason=...}.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
  interval: 30s

# Дефолтный ClusterRole чарта шире, чем нужно: в `rbac.rules` он даёт cluster-wide
# `secrets`, `configmaps`, CRD monitoring.coreos.com и ещё десяток ресурсов. Для
# discovery.kubernetes(role=pod) и loki.source.kubernetes хватает чтения подов и их
# логов — оставляем одно правило.
# Ограничение чарта 1.15.0: `rbac.clusterRules: []` ломает рендер (шаблон rbac.yaml
# дописывает `[]` в конец списка rules → невалидный YAML). Поэтому clusterRules
# остаются дефолтными: это read-only `nodes`, `nodes/pods`, `nodes/metrics` и
# nonResourceURL `/metrics`. Секретов и configmaps там нет — риск ограничен чтением
# метрик узлов, которые мы не используем.
rbac:
  create: true
  namespaces: []
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]

# PodLogs CRD не используем (loki.source.podlogs не включён) — не ставим её. Уже
# установленная предыдущим релизом CRD при смене значения не удаляется: это поведение
# Helm (`crds/` не управляются после install), чистить отдельным `kubectl delete crd`.
crds:
  create: false
