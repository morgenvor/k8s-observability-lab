# Values kube-prometheus-stack для лабы (окно Boutique 2026-10-28).
# 2026-11-03: перенесён из proxmox-lab/k8s/monitoring/values-kps-small.yaml
# (каталог лабы удалён); retention 24h→72h, Boutique удалён.
# Состав ПОЛНЫЙ (prometheus+grafana+alertmanager — ничего не выключаем upfront),
# ужаты только retention/storage/интервалы/ресурсы. Пин чарта: 92.14.1.
# Исключение 2026-11-04: выключены kube-controller-manager, kube-scheduler и
# kube-proxy — их в k3s нет как отдельных целей (см. блок в конце файла).
# Порядок урезания при красных замерах — см. план окна (retention→лимиты→alertmanager).
# Источник дефолтов: prometheus-community/kube-prometheus-stack 92.14.1 (values.yaml).

prometheus:
  enabled: true
  prometheusSpec:
    # 2026-11-03: 24h→72h — окно SLO 3 дня (медленный burn rate 1x/3d)
    # влезает в тот же PVC 5Gi; retentionSize остаётся вторым ограничителем.
    retention: 72h
    retentionSize: 5GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
  # 2026-11-07: постоянный доступ к UI без port-forward. k3s уже публикует Traefik
  # на 80/443 обеих нод (klipper-lb, `svclb-traefik`), поэтому второй контроллер не
  # ставим — добавляем только Ingress-объекты. Host-based, а не по путям: у
  # Prometheus и Alertmanager `--web.route-prefix=/`, и UI рассчитан на корень;
  # смена routePrefix потянула бы рестарт подов (аптайм Prometheus — дни).
  # `ingressClassName` явно, хотя `traefik` и так default: появится второй
  # контроллер — маршруты не «уедут» молча. Имена резолвятся через /etc/hosts
  # (см. docs/runbook.md, раздел 4); без правильного Host Traefik отдаёт 404.
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.lab.internal

grafana:
  enabled: true
  # 2026-10-28: limits подняты 256Mi→512Mi→768Mi — факт OOMKilled x6 за 3ч
  # (Grafana 13.2.4-distroless живьём ест ~400Mi в покое и ~600Mi+ после старта
  # со скрейпом всех targets; 512Mi тоже впритык). Запас на ноде есть
  # (server avail ~1,6Gi). Пересмотр — при долгом удержании.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # 2026-11-04 (фаза 5): datasource Loki. Ключ принадлежит чарту kube-prometheus-stack,
  # а не subchart grafana: templates/grafana/configmaps-datasources.yaml вставляет
  # элементы списка как есть в datasources: ConfigMap
  # `monitoring-kube-prometheus-grafana-datasource`, который читает sidecar Grafana.
  # Отдельного `datasources:` subchart'а не используем, чтобы не заводить второй
  # способ описания datasource в одном релизе. uid фиксирован — на него ссылаются
  # будущие панели логов; url прямой на Service SingleBinary (gateway в Loki выключен).
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      isDefault: false
  # 2026-11-07: PVC для /var/lib/grafana. До этого data-каталог был emptyDir, и при
  # каждом рестарте пода терялись пользовательские настройки из sqlite: часовой пояс
  # (user.timezone), избранные (starred) дашборды, папки/аннотации и API-ключи.
  # Дашборды и datasource приходят из ConfigMap, поэтому их это не касалось — но
  # «моё» состояние Grafana живёт только в grafana.db.
  # 1Gi с запасом: grafana.db в этой лабе — единицы мегабайт.
  # Recreate, а не RollingUpdate: PVC ReadWriteOnce на local-path (hostPath-подобный
  # PV с привязкой к ноде). При раскатке два пода одновременно просят один RWO-том,
  # и новый под на другой ноде встал бы в Multi-Attach/volume node affinity conflict,
  # то есть rollout подвис. Recreate даёт паузу в несколько секунд — для лабы ок.
  persistence:
    enabled: true
    type: pvc
    accessModes: ["ReadWriteOnce"]
    size: 1Gi
  deploymentStrategy:
    type: Recreate
  # 2026-11-07: постоянный доступ к UI без port-forward — см. комментарий у
  # `prometheus.ingress`. Grafana живёт на корне (`/`), root_url не задаём:
  # при Host-маршрутизации с чужим именем `/login` отвечает 200 и без него.
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.lab.internal

alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 24h
    # 2026-11-04 (фаза 4): обязательно, иначе AlertmanagerConfig из monitoring
    # получает матчер namespace="monitoring" (дефолт operator v0.94.2 —
    # OnNamespace), и алерты из demo в наш webhook не попадут. Проверяется
    # сгенерированным конфигом: kubectl -n monitoring get secret
    # alertmanager-monitoring-kube-prometheus-alertmanager-generated -o jsonpath=…
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # 2026-11-07: постоянный доступ к UI без port-forward — см. комментарий у
  # `prometheus.ingress`. Важно: UI Alertmanager не имеет аутентификации, поэтому
  # опубликованный маршрут позволяет из подсети лабы создавать/снимать silence,
  # то есть глушить алерты. Для изолированной лабы принято осознанно; при
  # расширении сети — basicAuth-мидлварь Traefik.
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.lab.internal

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# 2026-11-04: этих компонентов в k3s нет как отдельных целей — controller-manager,
# scheduler и kube-proxy живут внутри процессов k3s-server/k3s-agent и слушают
# 127.0.0.1, поэтому эндпоинтов у Service чарта нет. Следствие без этого блока:
# `absent(up{job="kube-controller-manager"})` и родственные выражения истинны всегда,
# и KubeControllerManagerDown / KubeSchedulerDown / KubeProxyDown (severity: critical)
# горят вечно. Их шум доходил до alert-sink и мешал доказательствам дриллов (фаза 6)
# и критерию приёмки «нет незапланированных алертов» (фаза 7).
# Выключаем именно эти три компонента: их метрик у нас никогда не было (`up`-серий
# не существовало), терять нечего. Проверяется офлайн-рендером: исчезают 3
# ServiceMonitor, 3 Service, 4 объекта PrometheusRule (6 алертов) и 3 пустых дашборда.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
